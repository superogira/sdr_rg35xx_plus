<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDRg35xx Web</title>
<link rel="stylesheet" href="/static/leaflet.css">
<script src="/static/leaflet.js"></script>
<style>
:root {
  /* phosphor/radio theme (default) */
  --bg:#0b1410; --panel:#12211a; --ink:#c8f0d8; --dim:#6f9c82; --acc:#35e08a; --warn:#ffd166;
  --card-border:var(--card-border); --btn:var(--btn); --btn-border:var(--hdr-border); --btn-hover:var(--btn-hover); --input:var(--input);
  --row-hover:#16281e; --hdr-border:#2a5a40; --track:#0e1a14; --thumb:#35e08a; --err:#ff8080;
}
[data-theme=light] {
  --bg:#f6f8fa; --panel:#ffffff; --ink:#1f2937; --dim:#6b7280; --acc:#2563eb; --warn:#b45309;
  --card-border:#e5e7eb; --btn:#eef2f7; --btn-border:#cbd5e1; --btn-hover:#dbe4ee; --input:#ffffff;
  --row-hover:#f1f5f9; --hdr-border:#e5e7eb; --track:#e5e7eb; --thumb:#2563eb; --err:#dc2626;
}
[data-theme=radio] {
  /* front-panel style: dark chassis, amber digits, raised knobs */
  --bg:#0d0f12; --panel:#15181d; --ink:#e8d9b0; --dim:#8a7a55; --acc:#f4a63c; --warn:#ff7043;
  --card-border:#24292f; --btn:#1c2126; --btn-border:#3a4148; --btn-hover:#252b31; --input:#101318;
  --row-hover:#1b2025; --hdr-border:#2c323a; --track:#101318; --thumb:#f4a63c; --err:#ff5252;
  --btn-raise:0 2px 0 rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 2px rgba(0,0,0,.6);
  --btn-press:0 0 0 rgba(0,0,0,0), inset 0 2px 4px rgba(0,0,0,.75);
}
[data-theme=radio] .freq { font-family:"Courier New",monospace; font-weight:700; letter-spacing:2px;
  color:var(--acc); text-shadow:0 0 14px rgba(244,166,60,.35);
  background:var(--input); border-radius:10px; padding:6px 12px; border:1px solid #2c323a;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.04); }
[data-theme=radio] .card { border-radius:14px;
  background:linear-gradient(180deg,#171b21 0%,#12151a 100%);
  border:1px solid #24292f;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 3px 8px rgba(0,0,0,.5); }
[data-theme=radio] button {
  border-radius:999px;
  background:linear-gradient(180deg,#2a3138 0%,#1a1f24 100%);
  border:1px solid #3a4148;
  border-top-color:#4a525c;
  box-shadow:var(--btn-raise);
  color:var(--ink);
  text-shadow:0 1px 0 rgba(0,0,0,.6);
  transition:transform .06s, box-shadow .06s;
}
[data-theme=radio] button:hover { background:linear-gradient(180deg,#2a3138 0%,#171c21 100%); }
[data-theme=radio] button:active {
  transform:translateY(1px);
  box-shadow:var(--btn-press);
}
[data-theme=radio] button.on {
  background:linear-gradient(180deg,#ffc163 0%,#e89f2a 100%);
  color:#1a1204;
  border-color:#f4a63c;
  box-shadow:var(--btn-raise), 0 0 12px rgba(244,166,60,.5);
  text-shadow:none;
}
[data-theme=radio] .sys div { border-radius:999px;
  background:var(--input);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.04);
  border:1px solid #24292f; }
[data-theme=radio] .sys b { color:var(--acc); text-shadow:0 0 10px rgba(244,166,60,.3); }
[data-theme=radio] table th, [data-theme=radio] table td { border-color:var(--hdr-border); }
[data-theme=radio] canvas { border-radius:8px; box-shadow:inset 0 2px 8px rgba(0,0,0,.8); }
[data-theme=radio] input[type=range] { accent-color:var(--acc); }
[data-theme=radio] input[type=number], [data-theme=radio] select {
  background:var(--input); border-color:#333a42;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6);
}
[data-theme=radio] header { background:linear-gradient(180deg,#15181d,#0d0f12);
  border-bottom:2px solid #f4a63c; box-shadow:0 2px 10px rgba(0,0,0,.5); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; transition:background .2s,color .2s; }
header { display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--panel); border-bottom:2px solid var(--acc); position:sticky; top:0; z-index:2; }
header h1 { font-size:16px; margin:0; letter-spacing:1px; }
#conn { font-size:12px; color:var(--dim); }
#conn.on { color:var(--acc); }
main { display:grid; grid-template-columns: 380px 1fr; gap:12px; padding:12px; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
/* Fullscreen spectrum (⛶ / F): only the spectrum card stays, the
   waterfall grows to fill the viewport. */
body.specfull { overflow:hidden; }
body.specfull main { display:block; padding:6px; }
body.specfull section:not(#sec-spec) { display:none; }
body.specfull #sec-spec > .card { display:flex; flex-direction:column; height:calc(100vh - 12px); box-sizing:border-box; }
body.specfull #spc, body.specfull #spcOv { height:170px !important; }
body.specfull #wfwrap { flex:1 1 auto; min-height:140px; }
body.specfull #wf, body.specfull #wfOv { height:100% !important; }
select, input { min-width:0; }
.row .val { flex:0 0 auto; }
.card { background:var(--panel); border:1px solid var(--card-border); border-radius:10px; padding:12px; }
.card h2 { font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--dim); margin:0 0 10px; }
button.nudge { padding:2px 7px; font-size:11px; line-height:1.4; flex:0 0 auto; }
#pane-map { position:relative; }
.mapctlbtn { }
body.maponly #mapctl button, body.maponly #mapctl select { background:rgba(10,20,15,.82); }
.tgt { background:none; border:none; }
.rip { position:relative; width:0; height:0; }
.rip i { position:absolute; left:-34px; top:-34px; width:68px; height:68px; border:2px solid #35e0d0; border-radius:50%; animation:rip 1.9s ease-out forwards; }
.rip i:nth-child(2) { animation-delay:.5s; }
.rip i:nth-child(3) { animation-delay:1s; }
@keyframes rip { from { transform:scale(.12); opacity:.95 } to { transform:scale(1.5); opacity:0 } }
@media (prefers-reduced-motion: reduce) { .rip i { animation:none; opacity:0; } }
.ownmark { outline:2px solid #fff; outline-offset:2px; border-radius:50%; }
.tgtlbl { background:rgba(0,0,0,.65); border:none; color:#dfe; font-size:11px; padding:1px 5px; border-radius:4px; }
body.maponly header, body.maponly .card:not(:has(#pane-map)) { display:none !important; }
body.maponly .tabs { display:none !important; }
body.maponly #mapPop { display:none !important; }
body.maponly main .card:has(#pane-map) { border:none; background:transparent; padding:0; margin:0 !important; height:100vh; }
body.maponly main .card:has(#pane-map) > h2, body.maponly main .card:has(#pane-map) > .tabs { display:none; }
body.maponly #pane-map #map { height:100vh !important; border-radius:0; }
body.maponly #mapctl { bottom:24px; }
body.maponly main { grid-template-columns:1fr; padding:0; gap:0; }
body.maponly .card:has(#pane-map) { margin:0; border:none; border-radius:0; padding:4px 6px; }
body.maponly { overflow:hidden; height:100vh; }
body.maponly main { padding:0; gap:0; height:100vh; overflow:hidden; align-items:start; }

.tgt svg { display:block; filter:drop-shadow(0 0 3px rgba(0,0,0,.85)); transition:transform .6s linear; }
.freq { font-size:34px; font-variant-numeric:tabular-nums; color:var(--acc); cursor:pointer; }
.freq small { font-size:14px; color:var(--dim); }
.row { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:8px 0; }
.row label { flex:0 0 76px; color:var(--dim); font-size:12px; }
.row .val { flex:1; font-variant-numeric:tabular-nums; }
button { background:var(--btn); color:var(--ink); border:1px solid var(--hdr-border); border-radius:6px; padding:5px 8px; cursor:pointer; font-size:12px; }
button:hover { background:var(--btn-hover); }
button.on { background:var(--acc); color:#062012; border-color:var(--acc); font-weight:700; }
input[type=range] { flex:1; accent-color:var(--acc); }
select, input[type=number] { background:var(--input); color:var(--ink); border:1px solid var(--hdr-border); border-radius:6px; padding:5px 8px; font-size:13px; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th { text-align:left; color:var(--dim); font-weight:600; border-bottom:1px solid var(--hdr-border); padding:4px 6px; }
td { padding:4px 6px; border-bottom:1px solid var(--row-hover); font-variant-numeric:tabular-nums; }
tr:hover td { background:var(--row-hover); }
.tabs { display:flex; gap:6px; margin-bottom:8px; }
.sys { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
.sys div { background:var(--input); border-radius:8px; padding:8px 4px; }
.sys b { display:block; font-size:18px; color:var(--acc); }
.sys span { font-size:11px; color:var(--dim); }
#err { color:var(--err); min-height:18px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>SDRg35xx</h1>
  <span id="conn">…</span>
  <span style="flex:1"></span>
  <button id="theme" data-i18n-title="ttTheme" style="font-size:12px;padding:5px 10px">☀️/🌙</button>
  <button id="lang" data-i18n-title="ttLang" style="font-size:12px;padding:5px 10px">EN</button>
  <span id="up" style="color:var(--dim);font-size:12px"></span>
</header>
<main>
  <section>
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin:0 0 10px">
        <h2 data-i18n="receiver" style="margin:0">Receiver</h2>
        <span style="flex:1"></span>
        <label data-i18n="rate" style="flex:0 0 auto;margin:0;font-size:12px;color:var(--dim)">Rate</label>
        <select id="rate" style="width:auto"></select>
      </div>
      <div class="freq" id="freq" data-i18n-title="tuneHint">0.0000 <small>MHz</small></div>
      <div class="row">
        <button id="dn1k">−1k</button><button id="dn100">−100</button>
        <button id="up100">+100</button><button id="up1k">+1k</button>
        <button id="up10k">+10k</button>
      </div>
      <div class="row" style="align-items:center">
        <div id="smeter" data-i18n-title="smeterTT" style="flex:1;position:relative;height:16px;border:1px solid var(--card-border);border-radius:4px;background:var(--panel);overflow:hidden">
          <div id="sfill" style="position:absolute;inset:0;width:0;background:linear-gradient(90deg,#46c878 0%,#46c878 68.7%,#ffd250 68.7%,#ffd250 85%,#ff5a46 85%,#ff5a46 100%)"></div>
          <div id="sticks" style="position:absolute;inset:0"></div>
          <div id="smark" style="position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.85);left:0;display:none"></div>
        </div>
        <span class="val" id="sval" style="min-width:112px;text-align:right">S0 · −100.0 dBFS</span>
      </div>
      <div class="row"><label data-i18n="mode">Mode</label><select id="mode"></select>
        <label style="flex:0 0 auto">BW</label><select id="bw"></select></div>
      <div class="row"><label data-i18n="gain">Gain</label><input type="range" id="gain" min="-10" max="49.6" step="0.1"><span class="val" id="gainv"></span></div>
      <div class="row"><label data-i18n="volume">Volume</label><input type="range" id="vol" min="0" max="1.5" step="0.001"><span class="val" id="volv"></span></div>
      <div class="row"><label data-i18n="squelch">Squelch</label><input type="range" id="sql" min="-100" max="0" step="1"><span class="val" id="sqlv"></span></div>
      <div class="row"><label data-i18n="ppm">PPM</label><input type="range" id="ppm" min="-120" max="120" step="1"><span class="val" id="ppmv"></span>
        <button id="ppmoff" title="leave correction to the server">OFF</button></div>
      <div class="row"><label data-i18n="nr">NR</label><input type="range" id="nr" min="0" max="9" step="1"><span class="val" id="nrv"></span></div>
      <div class="row"><label data-i18n="hp">HP</label><input type="range" id="hp" min="0" max="8" step="1"><span class="val" id="hpv"></span></div>
      <div class="row"><label data-i18n="lp">LP</label><input type="range" id="lp" min="0" max="8" step="1"><span class="val" id="lpv"></span></div>
      <div class="row" style="gap:4px">
        <button id="afn" data-i18n="af_narrow">แคบ</button>
        <button id="afm" data-i18n="af_normal">ปกติ</button>
        <button id="afw" data-i18n="af_wide">กว้าง</button>
      </div>
      <div class="row">
        <button id="agc">AGC</button>
        <button id="ft8">FT8</button>
        <button id="aisrf">AIS RF</button>
        <button id="wefax">FAX</button>
        <button id="cwdec">CW</button>
        <button id="listen" data-i18n-title="ttListen">🔇 ฟัง</button>
        <button id="lmute" data-i18n-title="ttMute">🔈 เครื่อง</button>
      </div>
      <div class="row"><label data-i18n="webvol">เสียงเว็บ</label><input type="range" id="wgain" min="0" max="3" step="0.1" value="1"><span class="val" id="wgainv">100%</span>
        <span class="val" id="abuf" style="color:var(--dim)"></span></div>
      <div id="err"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2 data-i18n="system">System</h2>
      <div class="sys">
        <div><b id="cpu">–</b><span data-i18n="cpupct">CPU %</span></div>
        <div><b id="mem">–</b><span data-i18n="mempct">MEM %</span></div>
        <div><b id="bat">–</b><span data-i18n="batpct">BAT %</span></div>
        <div><b id="tcpu">–</b><span data-i18n="cputemp">CPU °C</span></div>
        <div><b id="tgpu">–</b><span data-i18n="gputemp">GPU °C</span></div>
        <div><b id="tddr">–</b><span data-i18n="ddrtemp">DDR °C</span></div>
        <div><b id="tgt">–</b><span>✈ / ⛵</span></div>
        <div><b id="upb">–</b><span data-i18n="uptime">UP</span></div>
      </div>
      <div class="row" id="gpsrow" style="margin-top:10px;cursor:pointer" data-i18n-title="gpsTitle">
        <label style="font-weight:600">🛰 <span data-i18n="gpsLbl">GPS</span></label>
        <span class="val" id="gpssum" style="color:var(--dim)">–</span>
      </div>
      <div class="row" style="margin-top:6px">
        <label style="font-weight:600">📡 APRS</label>
        <button id="aprsrx">RX</button>
        <select id="aprsbeac" style="width:auto"></select>
        <button id="aprsis">IS</button>
        <button id="aprsig" data-i18n-title="ttIGate">IG</button>
        <button id="aprssrc" data-i18n-title="ttAprsSrc">GPS</button>
        <button id="aprsnow" data-i18n-title="aprsNowTT">📤</button>
        <span class="val" id="aprscount" style="color:var(--dim);min-width:24px;text-align:right">0</span>
      </div>
      <div class="row" style="margin-top:6px">
        <label data-i18n="panelLbl">หน้าจอ</label>
        <button id="pan-dim" data-i18n-title="ttPanDim">🔅 <span data-i18n="panelDim">ไฟหรี่</span></button>
        <button id="pan-off" data-i18n-title="ttPanOff">🌑 <span data-i18n="panelOff">ปิดจอ</span></button>
        <button id="pan-on">🌕 <span data-i18n="panelOn">เปิดจอ</span></button>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="upd">⬆ <span data-i18n="update">อัปเดตระบบ</span></button>
        <span class="val" id="updst" style="color:var(--dim);font-size:12px"></span>
      </div>
    </div>
  </section>
  <section id="sec-spec">
    <div class="card">
      <h2 style="display:flex;align-items:center;gap:8px"><span data-i18n="spectrum">Spectrum</span> <span id="specinfo" style="color:var(--dim);text-transform:none;letter-spacing:0;font-size:13px"></span><button id="specfull" title="เต็มจอ / Fullscreen (F)" style="margin-left:auto;padding:2px 10px">⛶</button></h2>
      <div style="position:relative">
        <canvas id="spc" width="512" height="110" style="width:100%;height:110px;cursor:crosshair;background:var(--bg);touch-action:none"></canvas>
        <canvas id="spcOv" width="512" height="110" style="position:absolute;inset:0;width:100%;height:110px;pointer-events:none"></canvas>
      </div>
      <canvas id="freqaxis" width="512" height="16" style="display:block;width:100%;height:16px;pointer-events:none"></canvas>
      <div style="position:relative;margin-top:2px" id="wfwrap">
        <canvas id="wf" width="512" height="240" style="width:100%;height:240px;cursor:crosshair;touch-action:none"></canvas>
        <canvas id="wfOv" width="512" height="240" style="position:absolute;inset:0;width:100%;height:240px;pointer-events:none"></canvas>
      </div>
      <div class="row" style="margin-top:6px"><label data-i18n="clicktune">คลิกกราฟ/น้ำตก = จูน</label><span class="val" id="clickhz" style="color:var(--dim)"></span></div>
      <div class="row" style="margin-top:6px"><label data-i18n="signal">สัญญาณ</label><span class="val" id="sigdb" style="color:var(--acc)">—</span></div>
      <div class="row"><label data-i18n="wfmin">น้ำตก ต่ำสุด</label><input type="range" id="wfmin" min="0" max="40" step="1"><span class="val" id="wfminv"></span></div>
      <div class="row"><label data-i18n="wfmax">น้ำตก สูงสุด</label><input type="range" id="wfmax" min="10" max="120" step="2"><span class="val" id="wfmaxv"></span></div>
      <div id="wfxbox" hidden>
        <div class="row" style="margin:6px 0 2px">
          <label data-i18n="wefax">WEFAX</label>
          <span class="val" id="wfxst" style="color:var(--dim)"></span>
          <button id="wfxsave" data-i18n="wefaxSave">บันทึก</button>
          <button id="wfxauto" data-i18n="wefaxAuto">เซฟอัตโนมัติ</button>
          <button id="wfxclear" data-i18n="wefaxClear">ล้าง</button>
          <span style="flex:1"></span>
          <button id="wfxl" data-i18n-title="ttWfxShift">⇤</button>
          <button id="wfxr" data-i18n-title="ttWfxShift">⇥</button>
        </div>
        <img id="wfximg" alt="WEFAX" style="display:block;width:100%;max-height:280px;object-fit:contain;image-rendering:pixelated;background:#000;border-radius:6px;border:1px solid var(--card-border)">
      </div>
      <div id="sstvbox" hidden>
        <div class="row" style="margin:6px 0 2px"><label>SSTV</label><span class="val" id="sstvst" style="color:var(--dim)">—</span></div>
        <img id="sstvimg" alt="SSTV" style="display:block;max-width:100%;width:auto;image-rendering:pixelated;background:#000;border-radius:6px;border:1px solid var(--card-border)">
      </div>
      <div id="cwbox" hidden>
        <div class="row" style="margin:6px 0 2px">
          <label data-i18n="cw">CW</label>
          <span class="val" id="cwst" style="color:var(--dim)"></span>
          <button id="cwclear" data-i18n="wefaxClear">ล้าง</button>
        <button id="sstv">SSTV</button>
        <button id="sstvview" data-i18n-title="ttSSTV">📺</button>
        </div>
        <div id="cwtext" style="font-family:monospace;font-size:13px;min-height:34px;max-height:96px;overflow-y:auto;background:#000;color:#bfe6bf;border-radius:6px;border:1px solid var(--card-border);padding:4px 6px;white-space:pre-wrap;word-break:break-all"></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="tabs">
        <button id="tab-ft8" class="on">FT8</button>
        <button id="tab-ais">AIS</button>
        <button id="tab-tgt" data-i18n="targets">Targets</button>
        <button id="tab-map" data-i18n="map">Map</button><button id="tab-aprs">APRS</button>
      </div>
      <div id="pane-map" hidden>
        <div id="map" style="height:420px;border-radius:8px;background:#0b1410"></div>
        <div id="mapctl" style="position:absolute;z-index:800;bottom:18px;left:8px;display:flex;gap:6px;align-items:center;pointer-events:auto">
          <button id="tgPlane">✈</button><button id="tgShip">⛵</button><button id="tgAprs">◆</button><button id="tgFt8">📡</button>
          <button id="tgLabel" data-i18n-title="ttLabel">🏷+🚩</button>
          <select id="mlayer" style="width:auto"></select>
          <span id="mattr" style="color:rgba(255,255,255,.75);font-size:11px;text-shadow:0 1px 2px #000"></span>
        </div>
        <button id="mapPop" data-i18n-title="ttMapPop" style="position:absolute;z-index:800;bottom:18px;right:44px">⛶</button>
      </div>
      <div id="pane-aprs" hidden>
        <div style="max-height:170px;overflow-y:auto"><table><thead><tr><th data-i18n="aprsSt">สถานี</th><th data-i18n="pos">พิกัด</th><th data-i18n="altspd">สูง/เร็ว</th><th data-i18n="age">อายุ</th></tr></thead><tbody id="aprsSt"></tbody></table></div>
        <h3 style="margin:8px 0 4px" data-i18n="aprsRxH">ประวัติรับ</h3>
        <div style="max-height:150px;overflow-y:auto"><table><tbody id="aprsRx"></tbody></table></div>

let lang = 'th', langPinned = false;
function applyLang(l, pin) {
  lang = l;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (STRINGS[l][k]) el.textContent = STRINGS[l][k];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const k = el.dataset.i18nTitle;
    if (STRINGS[l][k]) el.title = STRINGS[l][k];
  });
  $('lang').textContent = l === 'th' ? 'EN' : 'ไทย';
  $('lang').title = STRINGS[l].ttLang;
  try { if (st) renderState(st); } catch (e) {}
  try { if (specState) drawOverlays(); } catch (e) {}
}
{
  let l = 'th';
  try { l = localStorage.getItem('sdr-lang') || ''; } catch (e) {}
  if (l === 'en' || l === 'th') { langPinned = true; applyLang(l); }
}
$('lang').onclick = () => { langPinned = true; applyLang(lang === 'th' ? 'en' : 'th'); };
// Theme: 'phosphor' (default) or 'light', remembered per browser.
const THEMES = { phosphor: null, light: 'light', radio: 'radio' };
function themeLabel(name) {
  // Show the NEXT theme the button will switch to.
  return STRINGS[lang].nextTheme[name] || '';
}
function applyTheme(name) {
  document.documentElement.dataset.theme = THEMES[name] || '';
  try { localStorage.setItem('sdr-theme', name); } catch (e) {}
  $('theme').textContent = themeLabel(name);
}
{
  let t = 'phosphor';
  try { t = localStorage.getItem('sdr-theme') || 'phosphor'; } catch (e) {}
  applyTheme(t);
}
$('theme').onclick = () => {
  // The phosphor theme stores dataset.theme as '' — read the label as
  // the current theme instead of guessing from the empty string.
  const cur = document.documentElement.dataset.theme === '' ? 'phosphor'
    : document.documentElement.dataset.theme === 'light' ? 'light' : 'radio';
  const next = cur === 'phosphor' ? 'light' : cur === 'light' ? 'radio' : 'phosphor';
  applyTheme(next);
  if (typeof wf !== 'undefined' && wctx) { wctx.fillStyle = wfBg(); wctx.fillRect(0, 0, wf.width, wf.height); }
  if (typeof drawOverlays === 'function') drawOverlays();
};
let st = null, tab = 'ft8', rebootPending = false;
const fmtMHz = hz => (hz/1e6).toFixed(4);

async function api(path, body, signal) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {};
  if (signal) opt.signal = signal;
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(path + ' → ' + r.status);
  const d = await r.json();
  if (d && d.ok === false && d.err) throw new Error(d.err);
  return d;
}
let errTok = 0;
function showErr(msg) {
  const tok = ++errTok;
  $('err').textContent = msg;
  setTimeout(() => { if (tok === errTok) $('err').textContent = ''; }, 5000);
}
const cmd = c => api('/api/cmd', c).catch(e => showErr(STRINGS[lang][e.message] || e.message));

function renderState(s) {
  st = s;
  if (tab === 'map' && !map) initMap(s);
  if (!langPinned && s.lang && s.lang !== lang) applyLang(s.lang, false);
  $('conn').textContent = s.connected ? '● ' + s.host : STRINGS[lang].connOff + s.host;
  $('conn').className = s.connected ? 'on' : '';
  $('freq').innerHTML = fmtMHz(s.freqHz) + ' <small>MHz</small>';
  $('up').textContent = 'up ' + Math.floor(s.upSecs/60) + 'm';
  // selects
  if ($('mode').options.length !== s.modes.length) {
    $('mode').innerHTML = s.modes.map(m => `<option>${m}</option>`).join('');
  }
  $('mode').value = s.mode;
  const rlabels = s.rates.map(r => (r/1e6).toFixed(3).replace(/0+$/,'').replace(/\.$/,'') + 'M');
  if ($('rate').options.length !== s.rates.length) {
    $('rate').innerHTML = s.rates.map((r, i) => `<option value="${r}">${rlabels[i]}</option>`).join('');
  }
  $('rate').value = String(s.iqRate);
  let bws = s.bws;
  if (!bws.includes(s.bwHz)) bws = [s.bwHz].concat(bws); // mode default off-list
  $('bw').innerHTML = bws.map(b => `<option value="${b}">${(b/1000).toFixed(1)}k</option>`).join('');
  $('bw').value = String(s.bwHz);
  $('gain').value = s.gainDb; $('gainv').textContent = s.gainDb.toFixed(1) + ' dB';
  $('vol').value = s.vol;    $('volv').textContent = (s.vol*100 < 2 ? (s.vol*100).toFixed(1) : Math.round(s.vol*100)) + '%';
  $('sql').value = s.sqlDb;  $('sqlv').textContent = s.sqlDb + ' dBFS';
  $('ppm').value = s.ppm;    $('ppmv').textContent = (s.ppm>0?'+':'') + s.ppm;
  if (s.wfMin !== undefined) {
    $('wfmin').value = s.wfMin; $('wfminv').textContent = '+' + s.wfMin.toFixed(0) + ' dB';
    $('wfmax').value = s.wfMax; $('wfmaxv').textContent = s.wfMax.toFixed(0) + ' dB';
  }
  $('ppmoff').className = s.ppmOff ? 'on' : '';
  $('agc').className = s.agc ? 'on' : '';
  $('ft8').className = s.ft8 ? 'on' : '';
  $('aisrf').className = s.aisrf ? 'on' : '';
  $('wefax').className = s.wefax ? 'on' : '';
  $('cwdec').className = s.cw ? 'on' : '';
  $('sstv').className = s.sstv ? 'on' : '';
  $('cwbox').hidden = !s.cw;
  if (s.cw) {
    $('cwst').textContent = (s.cwWpm > 0 ? s.cwWpm.toFixed(1) + STRINGS[lang].cwwpm : STRINGS[lang].cwnone);
    const el = $('cwtext');
    if (el.textContent !== s.cwText) {
      const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 8;
      el.textContent = s.cwText || '· · ·';
      if (atEnd) el.scrollTop = el.scrollHeight;
    }
  }
  $('nr').value = s.nr;   $('nrv').textContent = s.nr > 0 ? s.nr : STRINGS[lang].off;
  afSet('hp', s.hp); afSet('lp', s.lp);
  $('afn').className = (s.hp === 400 && s.lp === 1700) ? 'on' : '';
  $('afm').className = (s.hp === 300 && s.lp === 2400) ? 'on' : '';
  $('afw').className = (s.hp === 100 && s.lp === 3000) ? 'on' : '';
  $('wfxbox').hidden = !s.wefax;
  if (s.wefax) {
    $('wfxauto').className = s.wefaxAuto ? 'on' : '';
    const map = {wait: 'wfxWait', phasing: 'wfxPhasing', rx: 'wfxRx'};
    $('wfxst').textContent = STRINGS[lang][map[s.wefaxState] || 'wfxWait'] + ' · ' + s.wefaxLines + STRINGS[lang].wfxLines;
  }
  // inverted: 'on' style = speaker active
  $('lmute').className = s.localmute ? '' : 'on';
  $('lmute').textContent = s.localmute ? STRINGS[lang].devOff : STRINGS[lang].devOn;
  $('cpu').textContent = s.cpu.toFixed(0);
  $('mem').textContent = s.mem.toFixed(0);
  $('bat').textContent = s.bat + (s.batCharging ? '⚡' : '');
  $('tgt').textContent = s.planes + '/' + s.ships;
  $('aprsrx').className = s.aprsRx ? 'on' : '';
  $('aprsis').className = s.aprsIs ? 'on' : '';
  $('aprssrc').textContent = s.aprsSrc === 'fix' ? 'FIX' : 'GPS';
  $('aprsig').className = s.aprsIgate ? 'on' : '';
  $('aprsbeac').value = String(s.aprsBeac);
  $('aprscount').textContent = s.aprsCount;
  $('tcpu').textContent = s.cpuTemp ? s.cpuTemp.toFixed(0) : '–';
  $('tgpu').textContent = s.gpuTemp ? s.gpuTemp.toFixed(0) : '–';
  $('tddr').textContent = s.ddrTemp ? s.ddrTemp.toFixed(0) : '–';
  $('upb').textContent = Math.floor(s.upSecs/60) + 'm';
  $('updst').textContent = s.updating || '';
  updateGPS(s.gps);
  for (const [id, v] of [['pan-on',0], ['pan-dim',1], ['pan-off',2]])
    $(id).className = (s.panel === v) ? 'on' : '';
  if (s.reboot) rebootPending = true;
  if (rebootPending && !s.reboot && !s.updating) {
    // the app came back from the OTA re-exec — pick up the new page
    rebootPending = false;
    location.reload();
  }
}

// ---- GPS: System-card summary row + detail modal ----
function gpsStatusText(g) {
  const T = STRINGS[lang];
  if (!g || !g.device) return T.gNone;
  if (!g.valid) return T.gNoFix;
  if (g.ageSec > 10) return T.gStale;
  return T.gFix + (g.hdop ? ' · HDOP ' + g.hdop.toFixed(1) : '');
}
function gpsTimeLabel(g) {
  const p = [];
  if (g && g.timeUTC && g.timeUTC.length >= 6)
    p.push(g.timeUTC.slice(0,2)+':'+g.timeUTC.slice(2,4)+':'+g.timeUTC.slice(4,6));
  if (g && g.dateUTC && g.dateUTC.length >= 6)
    p.push(g.dateUTC.slice(0,2)+'/'+g.dateUTC.slice(2,4)+'/'+g.dateUTC.slice(4,6));
  return p.length ? p.join(' · ') + ' UTC' : '–';
}
function updateGPS(g) {
  const T = STRINGS[lang];
  const sum = $('gpssum');
  if (g && g.valid) {
    sum.textContent = g.lat.toFixed(5) + ', ' + g.lon.toFixed(5) +
      ' · 🛰 ' + g.satsUsed + '/' + g.satsView;
    sum.style.color = '';
  } else {
    sum.textContent = gpsStatusText(g);
    sum.style.color = 'var(--dim)';
  }
  const modal = $('gpsmodal');
  if (modal.style.display !== 'flex') return;
  const rows = [
    [T.gDev, g && g.device ? g.device : T.gNone],
    [T.gStat, gpsStatusText(g)],
    [T.gTime, gpsTimeLabel(g)],
    [T.gPos, g && (g.lat || g.lon) ? g.lat.toFixed(6) + ', ' + g.lon.toFixed(6) : '–'],
    [T.gGrid, g && g.grid ? g.grid : '–'],
    [T.gAlt, g && g.alt ? g.alt.toFixed(1) + ' m' : '–'],
    [T.gSpd, g && g.speedKt > 0.05 ? g.speedKt.toFixed(1) + ' kt / ' + (g.speedKt*1.852).toFixed(1) + ' km/h' : '–'],
    [T.gCse, g && g.course > 0.05 ? g.course.toFixed(0) + '°' : '–'],
    [T.gSat, g ? g.satsUsed + ' / ' + g.satsView : '–'],
    [T.gHdop, g && g.hdop ? g.hdop.toFixed(1) : '–'],
    [T.gAge, g && g.ageSec !== undefined ? Math.max(0, Math.round(g.ageSec)) + ' s' : '–'],
    [T.gFollow, g ? (g.follow ? T.gOn : T.gOff) : '–'],

  const cl = Math.cos(mLa * Math.PI / 180) || 1e-6;
  const dx = (lo2 - lo1) * cl, dy = la2 - la1;
  const d = Math.hypot(dx, dy) || 1e-9;
  let px = -dy, py = dx;                 // perpendicular
  if (py < 0) { px = -px; py = -py; }    // arc over the NORTH side
  const h = d * peak;
  px = px / (Math.hypot(px, py) || 1) * h;
  py = py / (Math.hypot(px, py) || 1) * h;
  const cLa = mLa + py, cLo = mLo + px / cl;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([u * u * la1 + 2 * u * t * cLa + t * t * la2,
              u * u * lo1 + 2 * u * t * cLo + t * t * lo2]);
  }
  return pts;
}
// Flow animation: requestAnimationFrame with guards — while the map

// dash updates would fight Leaflet's own repaint and jank low-end

// layers cost nothing.
let flowPaths = [], flowPhase = 0, flowLastTs = 0, mapMoving = 0, flowRafOn = false;

  if (!flowPaths.length || document.hidden || mapMoving > 0) { flowLastTs = ts; return; }

  flowPhase = (flowPhase + (ts - flowLastTs) * 0.045) % 26;
  flowLastTs = ts;
  for (const f of flowPaths) {
    const el = f.el.getElement ? f.el.getElement() : f.el._path;

  }
}

let ft8Sig = '', rippleSeen = {};
async function ft8MapPoll() {
  if (!map) return;
  try {
    const es = await api('/api/ft8map');
    const sig = JSON.stringify(es);
    if (sig === ft8Sig) return; // nothing new: keep the paths as-is
    ft8Sig = sig;
    ft8Layer.clearLayers();
    if (showMask & FT8BIT) {
      // Ripple where a transmission just happened (fresh decode): the
      // web twin of the handheld's cyan CQ ripple.
      const nowS = Date.now() / 1000;
      for (const e of es) {
        if (e.ageSec < 15) {
          const key = e.call + '|' + e.text;
          if (!rippleSeen[key] || nowS - rippleSeen[key] > 30) {
            rippleSeen[key] = nowS;
            const la = e.arc ? e.fromLat : e.lat, lo = e.arc ? e.fromLon : e.lon;
            const rip = L.marker([la, lo], { icon: L.divIcon({ className: 'rip', html: '<i></i><i></i><i></i>', iconSize: [0, 0] }), interactive: false });
            rip.addTo(ft8Layer);
            setTimeout(() => ft8Layer.removeLayer(rip), 2400);
          }
        }
      }
      flowPaths = [];
      for (const e of es) {
        if (e.arc) {
          // QSO: curved dashed flow sender → receiver over a dark
          // casing so it reads on every basemap (light AND dark).
          // Two overlaid 6-on/18-off patterns offset by half a period
          // give the handheld's per-dash yellow/orange alternation
          // (not a whole-line blink); both advance with one phase.
          const pts = arcPath(e.fromLat, e.fromLon, e.lat, e.lon);
          L.polyline(pts, { color: '#000', weight: 5, opacity: .55, lineCap: 'round' }).addTo(ft8Layer);
          const yel = L.polyline(pts, { color: '#ffd24a', weight: 2.4, opacity: .95, dashArray: '6 18', lineCap: 'round' }).addTo(ft8Layer);
          const org = L.polyline(pts, { color: '#ff9a40', weight: 2.4, opacity: .95, dashArray: '6 18', lineCap: 'round' }).addTo(ft8Layer);
          flowPaths.push({ el: yel, off: 0 }, { el: org, off: -12 });
          // The SENDER draws red at the arc's origin (device rule).
          L.circleMarker([e.fromLat, e.fromLon], { radius: 3.5, color: '#ff5a5a', weight: 1.5, fillColor: '#ff5a5a', fillOpacity: .8 })
            .bindTooltip(`<span style="color:#ff5a5a">${esc(e.call)}</span> · ${esc(e.text.slice(0, 30))}`, { direction: 'top' })
            .addTo(ft8Layer);
        }
        const col = e.arc ? '#35e08a' : '#ff5a5a';
        const mk = L.circleMarker([e.lat, e.lon], { radius: e.cq ? 4 : 3.5, color: col, weight: 1.5, fillColor: col, fillOpacity: e.approx ? 0.15 : 0.6 });
        if (e.approx) mk.setStyle({ fillOpacity: 0.1, dashArray: '2 2' }); // country-level guess: hollow
        mk.bindTooltip(`<span style="color:${col}">${esc(e.call)}</span> ${e.text ? '· ' + esc(e.text.slice(0, 30)) : ''}`, { direction: 'top' });
        mk.addTo(ft8Layer);

}

let tgtSig = '';
async function mapPoll() {
  if (!map) return;
  const rows = await api('/api/targets');
  const sig = JSON.stringify(rows);
  if (sig === tgtSig) return; // unchanged feed: skip the full rebuild
  tgtSig = sig;
  const seen = {};
  for (const t of rows) {
    const key = t.kind + t.id;
    if (!(showMask & kindBit[t.kind])) {
      seen[key] = true; // suppress without cleanup below
      if (markers[key]) { map.removeLayer(markers[key]); delete markers[key]; }
      if (trailGroups[key]) { trailGroups[key].clearLayers(); delete trailGroups[key]; }
      continue;
    }
    seen[key] = true;
    const ll = [t.lat, t.lon];
    let m = markers[t.kind + t.id];
    const col = t.kind === 'plane' ? altColor(t.altFt) : t.kind === 'aprs' ? '#ff5aff' : '#35e08a';
    if (!t.hasPos) { if (m) { map.removeLayer(m); delete markers[t.kind + t.id]; } continue; }
    if (!m) {
      m = markers[key] = L.marker(ll, {
        icon: L.divIcon({ className: 'tgt' + (t.own ? ' ownmark' : ''), html: ICONS[t.kind] || ICONS.aprs, iconSize: [26, 26], iconAnchor: [13, 13] }),
      }).addTo(map);
      m.bindTooltip('', { direction: 'top', permanent: true, className: 'tgtlbl', opacity: .9 });
      m.on('click', () => {
        const rows = [
          `<b>${flagImg(t.country)} ${esc(t.call)}</b>`,
          `${t.lat.toFixed(4)}, ${t.lon.toFixed(4)}`,
        ];
        if (t.kind === 'plane') rows.push(`${t.altFt} ft · ${t.speed.toFixed(0)} kt · ${t.track}°`);
        if (t.kind === 'ship') rows.push(`${t.speed.toFixed(1)} kt · ${t.track}°`);
        if (t.kind === 'aprs' && t.comment) rows.push(esc(t.comment));
        rows.push(`${t.ageSec.toFixed(0)}s`);
        m.bindPopup(rows.join('<br>')).openPopup();
      });
    } else {
      m.setLatLng(ll);
    }
    // Label modes: flag+text / flag / none / text (like the handheld)
    const tip = m.getTooltip();
    if (tip) {
      // setContent('') does NOT clear Leaflet's tooltip DOM (its
      // _updateContent early-returns on empty content), so stale
      // flags/text stayed visible in "none" mode — hide the element
      // instead and set content only for the visible modes.
      const el2 = tip.getElement ? tip.getElement() : null;
      if (labelMode === 2) {
        if (el2) el2.style.display = 'none';
      } else {
        if (el2) el2.style.display = '';
        tip.setContent((labelMode !== 3 ? flagImg(t.country) + ' ' : '') + (labelMode !== 1 ? esc(t.call) : ''));
      }
    }
    const el = m.getElement();
    if (el) {
      el.style.setProperty('--tgt-col', col);
      // nose/bow along the true course (track deg, 0 = north)
      el.firstElementChild.style.transform = 'rotate(' + (t.track || 0) + 'deg)';
    }
    // Flown path: altitude-coloured breadcrumbs, fading with age —
    // the same convention as the handheld radar.
    if ((t.kind === 'plane' || t.kind === 'ship') && t.trail && t.trail.length) {
      let g = trailGroups[key];
      if (!g) { g = trailGroups[key] = L.layerGroup().addTo(map); }
      g.clearLayers();
      if (t.kind === 'ship') {
        // Vessel track: one thin 2px line (dots every 5 min would be
        // sparse for slow movers).
        const pts = t.trail.map(d => [d.lat, d.lon]);
        pts.push([t.lat, t.lon]);
        if (pts.length >= 2) L.polyline(pts, { color: '#35e08a', weight: 2, opacity: .6 }).addTo(g);
      } else {
        for (const d of t.trail) {
          const c = altColor(d.altFt);
          const op = d.ageSec > 150 ? 0.35 : d.ageSec > 60 ? 0.6 : 0.9;
          L.circleMarker([d.lat, d.lon], { radius: 2.5, stroke: false, fillColor: c, fillOpacity: op }).addTo(g);
        }
      }
    } else if (trailGroups[key]) {
      trailGroups[key].clearLayers();
      delete trailGroups[key];
    }
  }
  for (const k in markers) if (!seen[k]) { map.removeLayer(markers[k]); delete markers[k]; }
  for (const k in trailGroups) if (!seen[k]) { trailGroups[k].clearLayers(); delete trailGroups[k]; }
}
(async function specLoop() {

// Fine-adjust arrows for every slider: ◀/▶ nudge by one step (the
// same handlers run via the input event, so cmds go out as usual).
document.querySelectorAll('input[type=range]').forEach(sl => {
  const step = parseFloat(sl.step) || 1;
  const dec = (String(sl.step).split('.')[1] || '').length;
  const nudge = d => {
    let v = parseFloat(sl.value) || 0;
    if (sl.id === 'vol') {
      // Volume arrows (display is %): 1% steps normally; in the quiet
      // zone below 1% both directions step 0.1% — listening at very low
      // levels needs it. Boundary-snapped: 1.1% ↓ lands on 1% (never
      // skips into the fine zone), and climbing from below tops out at
      // exactly 1% before the coarse 1% grid resumes.
      const P1 = 0.01, P01 = 0.001; // 1% / 0.1% in slider units
      if (d > 0) v = v < P1 ? Math.min(P1, v + P01) : Math.min(+sl.max, v + P1);
      else       v = v > P1 ? Math.max(P1, v - P1) : Math.max(+sl.min, v - P01);
      sl.value = v.toFixed(3);
    } else {
      let nv = v + d * step;
      nv = Math.max(+sl.min, Math.min(+sl.max, nv));
      sl.value = (Math.round(nv / step) * step).toFixed(dec);
    }
    sl.dispatchEvent(new Event('input', { bubbles: true }));
  };
  const mk = (txt, d) => {
    const b = document.createElement('button');
    b.className = 'nudge'; b.textContent = txt; b.tabIndex = -1;
    b.onclick = () => nudge(d);
    return b;
  };
  sl.insertAdjacentElement('beforebegin', mk('◀', -1));
  sl.insertAdjacentElement('afterend', mk('▶', 1));
  // Keyboard arrows follow the same custom stepping as the buttons
  // (native arrows would use the 0.05 drag step).
  if (sl.id === 'vol') {
    sl.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { nudge(-1); e.preventDefault(); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { nudge(1); e.preventDefault(); }
    });
  }
});
