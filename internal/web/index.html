<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDRg35xx Web</title>
<link rel="stylesheet" href="/static/leaflet.css">
<script src="/static/leaflet.js"></script>
<style>
:root {
  /* phosphor/radio theme (default) */
  --bg:#0b1410; --panel:#12211a; --ink:#c8f0d8; --dim:#6f9c82; --acc:#35e08a; --warn:#ffd166;
  --card-border:var(--card-border); --btn:var(--btn); --btn-border:var(--hdr-border); --btn-hover:var(--btn-hover); --input:var(--input);
  --row-hover:#16281e; --hdr-border:#2a5a40; --track:#0e1a14; --thumb:#35e08a; --err:#ff8080;
}
[data-theme=light] {
  --bg:#f6f8fa; --panel:#ffffff; --ink:#1f2937; --dim:#6b7280; --acc:#2563eb; --warn:#b45309;
  --card-border:#e5e7eb; --btn:#eef2f7; --btn-border:#cbd5e1; --btn-hover:#dbe4ee; --input:#ffffff;
  --row-hover:#f1f5f9; --hdr-border:#e5e7eb; --track:#e5e7eb; --thumb:#2563eb; --err:#dc2626;
}
[data-theme=radio] {
  /* front-panel style: dark chassis, amber digits, raised knobs */
  --bg:#0d0f12; --panel:#15181d; --ink:#e8d9b0; --dim:#8a7a55; --acc:#f4a63c; --warn:#ff7043;
  --card-border:#24292f; --btn:#1c2126; --btn-border:#3a4148; --btn-hover:#252b31; --input:#101318;
  --row-hover:#1b2025; --hdr-border:#2c323a; --track:#101318; --thumb:#f4a63c; --err:#ff5252;
  --btn-raise:0 2px 0 rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 2px rgba(0,0,0,.6);
  --btn-press:0 0 0 rgba(0,0,0,0), inset 0 2px 4px rgba(0,0,0,.75);
}
[data-theme=radio] .freq { font-family:"Courier New",monospace; font-weight:700; letter-spacing:2px;
  color:var(--acc); text-shadow:0 0 14px rgba(244,166,60,.35);
  background:var(--input); border-radius:10px; padding:6px 12px; border:1px solid #2c323a;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.04); }
[data-theme=radio] .card { border-radius:14px;
  background:linear-gradient(180deg,#171b21 0%,#12151a 100%);
  border:1px solid #24292f;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 3px 8px rgba(0,0,0,.5); }
[data-theme=radio] button {
  border-radius:999px;
  background:linear-gradient(180deg,#2a3138 0%,#1a1f24 100%);
  border:1px solid #3a4148;
  border-top-color:#4a525c;
  box-shadow:var(--btn-raise);
  color:var(--ink);
  text-shadow:0 1px 0 rgba(0,0,0,.6);
  transition:transform .06s, box-shadow .06s;
}
[data-theme=radio] button:hover { background:linear-gradient(180deg,#2a3138 0%,#171c21 100%); }
[data-theme=radio] button:active {
  transform:translateY(1px);
  box-shadow:var(--btn-press);
}
[data-theme=radio] button.on {
  background:linear-gradient(180deg,#ffc163 0%,#e89f2a 100%);
  color:#1a1204;
  border-color:#f4a63c;
  box-shadow:var(--btn-raise), 0 0 12px rgba(244,166,60,.5);
  text-shadow:none;
}
[data-theme=radio] .sys div { border-radius:999px;
  background:var(--input);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.04);
  border:1px solid #24292f; }
[data-theme=radio] .sys b { color:var(--acc); text-shadow:0 0 10px rgba(244,166,60,.3); }
[data-theme=radio] table th, [data-theme=radio] table td { border-color:var(--hdr-border); }
[data-theme=radio] canvas { border-radius:8px; box-shadow:inset 0 2px 8px rgba(0,0,0,.8); }
[data-theme=radio] input[type=range] { accent-color:var(--acc); }
[data-theme=radio] input[type=number], [data-theme=radio] select {
  background:var(--input); border-color:#333a42;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6);
}
[data-theme=radio] header { background:linear-gradient(180deg,#15181d,#0d0f12);
  border-bottom:2px solid #f4a63c; box-shadow:0 2px 10px rgba(0,0,0,.5); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; transition:background .2s,color .2s; }
header { display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--panel); border-bottom:2px solid var(--acc); position:sticky; top:0; z-index:2; }
header h1 { font-size:16px; margin:0; letter-spacing:1px; }
#conn { font-size:12px; color:var(--dim); }
#conn.on { color:var(--acc); }
main { display:grid; grid-template-columns: 340px 1fr; gap:12px; padding:12px; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
.card { background:var(--panel); border:1px solid var(--card-border); border-radius:10px; padding:12px; }
.card h2 { font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--dim); margin:0 0 10px; }
.freq { font-size:34px; font-variant-numeric:tabular-nums; color:var(--acc); cursor:pointer; }
.freq small { font-size:14px; color:var(--dim); }
.row { display:flex; align-items:center; gap:8px; margin:8px 0; }
.row label { flex:0 0 84px; color:var(--dim); font-size:12px; }
.row .val { flex:1; font-variant-numeric:tabular-nums; }
button { background:var(--btn); color:var(--ink); border:1px solid var(--hdr-border); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:13px; }
button:hover { background:var(--btn-hover); }
button.on { background:var(--acc); color:#062012; border-color:var(--acc); font-weight:700; }
input[type=range] { flex:1; accent-color:var(--acc); }
select, input[type=number] { background:var(--input); color:var(--ink); border:1px solid var(--hdr-border); border-radius:6px; padding:5px 8px; font-size:13px; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th { text-align:left; color:var(--dim); font-weight:600; border-bottom:1px solid var(--hdr-border); padding:4px 6px; }
td { padding:4px 6px; border-bottom:1px solid var(--row-hover); font-variant-numeric:tabular-nums; }
tr:hover td { background:var(--row-hover); }
.tabs { display:flex; gap:6px; margin-bottom:8px; }
.sys { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center; }
.sys div { background:var(--input); border-radius:8px; padding:8px 4px; }
.sys b { display:block; font-size:18px; color:var(--acc); }
.sys span { font-size:11px; color:var(--dim); }
#err { color:var(--err); min-height:18px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>SDRg35xx</h1>
  <span id="conn">…</span>
  <span style="flex:1"></span>
  <button id="theme" title="สลับธีม" style="font-size:12px;padding:5px 10px">☀️/🌙</button>
  <span id="up" style="color:var(--dim);font-size:12px"></span>
</header>
<main>
  <section>
    <div class="card">
      <h2>Receiver</h2>
      <div class="freq" id="freq" title="click to tune">0.0000 <small>MHz</small></div>
      <div class="row">
        <button id="dn1k">−1k</button><button id="dn100">−100</button>
        <button id="up100">+100</button><button id="up1k">+1k</button>
        <button id="up10k">+10k</button>
      </div>
      <div class="row"><label>Tune</label><input type="number" id="tune" step="1000" style="flex:1"><button id="go">Go</button></div>
      <div class="row"><label>Mode</label><select id="mode"></select>
        <label style="flex:0 0 auto">BW</label><select id="bw"></select></div>
      <div class="row"><label>Gain</label><input type="range" id="gain" min="-10" max="49.6" step="0.1"><span class="val" id="gainv"></span></div>
      <div class="row"><label>Volume</label><input type="range" id="vol" min="0" max="1.5" step="0.05"><span class="val" id="volv"></span></div>
      <div class="row"><label>Squelch</label><input type="range" id="sql" min="-100" max="0" step="1"><span class="val" id="sqlv"></span></div>
      <div class="row"><label>PPM</label><input type="range" id="ppm" min="-120" max="120" step="1"><span class="val" id="ppmv"></span>
        <button id="ppmoff" title="leave correction to the server">OFF</button></div>
      <div class="row">
        <button id="agc">AGC</button>
        <button id="ft8">FT8</button>
        <button id="aisrf">AIS RF</button>
        <button id="listen" title="สตรีมเสียงจากเครื่องเกม">🔇 ฟัง</button>
        <button id="lmute" title="ปิดลำโพงเครื่องเกม (เว็บยังได้ยิน)">🔈 เครื่อง</button>
      </div>
      <div class="row"><label>เสียงเว็บ</label><input type="range" id="wgain" min="0" max="3" step="0.1" value="1"><span class="val" id="wgainv">100%</span>
        <span class="val" id="abuf" style="color:var(--dim)"></span></div>
      <div id="err"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>System</h2>
      <div class="sys">
        <div><b id="cpu">–</b><span>CPU %</span></div>
        <div><b id="mem">–</b><span>MEM %</span></div>
        <div><b id="bat">–</b><span>BAT %</span></div>
        <div><b id="tgt">–</b><span>✈/</span></div>
      </div>
    </div>
  </section>
  <section>
    <div class="card">
      <h2>Spectrum <span id="specinfo" style="color:var(--dim);text-transform:none;letter-spacing:0"></span></h2>
      <canvas id="spc" width="512" height="110" style="width:100%;height:110px;cursor:crosshair;background:var(--bg)"></canvas>
      <canvas id="wf" width="512" height="240" style="width:100%;height:240px;cursor:crosshair;margin-top:4px"></canvas>
      <div class="row" style="margin-top:6px"><label>คลิกกราฟ/น้ำตก = จูน</label><span class="val" id="clickhz" style="color:var(--dim)"></span></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="tabs">
        <button id="tab-ft8" class="on">FT8</button>
        <button id="tab-ais">AIS</button>
        <button id="tab-tgt">Targets</button>
        <button id="tab-map">Map</button>
      </div>
      <div id="pane-map" hidden><div id="map" style="height:420px;border-radius:8px;background:#0b1410"></div>
        <div class="row" style="margin-top:6px"><label>ชั้นแผนที่</label><select id="mlayer"></select>
          <span class="val" id="mattr" style="color:var(--dim);font-size:11px"></span></div>
      </div>
      <div id="pane-ft8"><table><thead><tr><th>เวลา</th><th>SNR</th><th>Hz</th><th>ข้อความ</th><th>ประเทศ/ระยะ</th></tr></thead><tbody id="ft8b"></tbody></table></div>
      <div id="pane-ais" hidden><table><thead><tr><th>เวลา</th><th>ch</th><th>dB</th><th>ข้อความ</th></tr></thead><tbody id="aisb"></tbody></table></div>
      <div id="pane-tgt" hidden><table><thead><tr><th>ชนิด</th><th>ชื่อ/ทะเบียน</th><th>พิกัด</th><th>สูง/เร็ว</th><th>ทิศ</th><th>อายุ</th></tr></thead><tbody id="tgtb"></tbody></table></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
// Theme: 'phosphor' (default) or 'light', remembered per browser.
const THEMES = { phosphor: null, light: 'light', radio: 'radio' };
function themeLabel(name) {
  return name === 'phosphor' ? '☀️ ขาว' : name === 'light' ? '📻 วิทยุ' : '💡 สีเขียว';
}
function applyTheme(name) {
  document.documentElement.dataset.theme = THEMES[name] || '';
  try { localStorage.setItem('sdr-theme', name); } catch (e) {}
  $('theme').textContent = themeLabel(name);
}
{
  let t = 'phosphor';
  try { t = localStorage.getItem('sdr-theme') || 'phosphor'; } catch (e) {}
  applyTheme(t);
}
$('theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || 'phosphor';
  const next = cur === '' ? 'light' : cur === 'light' ? 'radio' : 'phosphor';
  applyTheme(next);
  if (typeof wf !== 'undefined' && wctx) { wctx.fillStyle = wfBg(); wctx.fillRect(0, 0, wf.width, wf.height); }
};
let st = null, tab = 'ft8';
const fmtMHz = hz => (hz/1e6).toFixed(4);

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(path + ' → ' + r.status);
  return r.json();
}
const cmd = c => api('/api/cmd', c).catch(e => { $('err').textContent = e.message; });

function renderState(s) {
  st = s;
  $('conn').textContent = s.connected ? '● ' + s.host : '○ ไม่เชื่อมต่อ ' + s.host;
  $('conn').className = s.connected ? 'on' : '';
  $('freq').innerHTML = fmtMHz(s.freqHz) + ' <small>MHz</small>';
  $('up').textContent = 'up ' + Math.floor(s.upSecs/60) + 'm';
  // selects
  if ($('mode').options.length !== s.modes.length) {
    $('mode').innerHTML = s.modes.map(m => `<option>${m}</option>`).join('');
  }
  $('mode').value = s.mode;
  let bws = s.bws;
  if (!bws.includes(s.bwHz)) bws = [s.bwHz].concat(bws); // mode default off-list
  $('bw').innerHTML = bws.map(b => `<option value="${b}">${(b/1000).toFixed(1)}k</option>`).join('');
  $('bw').value = String(s.bwHz);
  $('gain').value = s.gainDb; $('gainv').textContent = s.gainDb.toFixed(1) + ' dB';
  $('vol').value = s.vol;    $('volv').textContent = Math.round(s.vol*100) + '%';
  $('sql').value = s.sqlDb;  $('sqlv').textContent = s.sqlDb + ' dBFS';
  $('ppm').value = s.ppm;    $('ppmv').textContent = (s.ppm>0?'+':'') + s.ppm;
  $('ppmoff').className = s.ppmOff ? 'on' : '';
  $('agc').className = s.agc ? 'on' : '';
  $('ft8').className = s.ft8 ? 'on' : '';
  $('aisrf').className = s.aisrf ? 'on' : '';
  // inverted: 'on' style = speaker active
  $('lmute').className = s.localmute ? '' : 'on';
  $('lmute').textContent = s.localmute ? '🔇 เครื่อง' : '🔈 เครื่อง';
  $('cpu').textContent = s.cpu.toFixed(0);
  $('mem').textContent = s.mem.toFixed(0);
  $('bat').textContent = s.bat;
  $('tgt').textContent = s.planes + '/' + s.ships;
}

async function poll() {
  try { renderState(await api('/api/state')); $('err').textContent = ''; }
  catch (e) { $('conn').textContent = '○ เว็บไม่ตอบ'; $('conn').className=''; }
  try {
    if (tab === 'ft8') {
      const rows = await api('/api/ft8');
      $('ft8b').innerHTML = rows.slice().reverse().map(r =>
        `<tr><td>${r.time}</td><td>${r.snr.toFixed(0)}</td><td>${r.hz.toFixed(0)}</td><td>${esc(r.text)}</td><td>${esc(r.anno)}</td></tr>`).join('');
    } else if (tab === 'ais') {
      const rows = await api('/api/ais');
      $('aisb').innerHTML = rows.slice().reverse().map(r =>
        `<tr><td>${r.time}</td><td>${r.ch}</td><td>${r.db.toFixed(0)}</td><td>${esc(r.text)}</td></tr>`).join('');
    } else {
      const rows = await api('/api/targets');
      $('tgtb').innerHTML = rows.map(r =>
        `<tr><td>${r.kind==='plane'?'✈':''}</td><td>${esc(r.call)}</td><td>${r.hasPos?r.lat.toFixed(4)+', '+r.lon.toFixed(4):'—'}</td><td>${r.kind==='plane'?r.altFt+' ft':r.speed.toFixed(1)+' kt'}</td><td>${r.track}°</td><td>${r.ageSec.toFixed(0)}s</td></tr>`).join('');
    }
  } catch (e) {}
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('go').onclick = () => cmd({cmd:'freq', hz: parseFloat($('tune').value)*1e6});
$('dn1k').onclick = () => cmd({cmd:'freq', hz: st.freqHz - 1000});
$('dn100').onclick = () => cmd({cmd:'freq', hz: st.freqHz - 100});
$('up100').onclick = () => cmd({cmd:'freq', hz: st.freqHz + 100});
$('up1k').onclick = () => cmd({cmd:'freq', hz: st.freqHz + 1000});
$('up10k').onclick = () => cmd({cmd:'freq', hz: st.freqHz + 10000});
$('mode').onchange = e => cmd({cmd:'mode', name: e.target.value});
$('bw').onchange = e => cmd({cmd:'bw', hz: parseFloat(e.target.value)});
$('gain').oninput = e => cmd({cmd:'gain', db: parseFloat(e.target.value)});
$('vol').oninput = e => cmd({cmd:'vol', v: parseFloat(e.target.value)});
$('sql').oninput = e => cmd({cmd:'sql', db: parseFloat(e.target.value)});
$('ppm').oninput = e => cmd({cmd:'ppm', v: parseFloat(e.target.value)});
$('ppmoff').onclick = () => cmd({cmd:'ppmoff', on: !st.ppmOff});
$('agc').onclick = () => cmd({cmd:'agc', on: !st.agc});
$('ft8').onclick = () => cmd({cmd:'ft8', on: !st.ft8});
$('aisrf').onclick = () => cmd({cmd:'aisrf', on: !st.aisrf});
for (const t of ['ft8','ais','tgt','map']) {
  $('tab-'+t).onclick = () => {
    tab = t;
    for (const o of ['ft8','ais','tgt','map']) {
      $('tab-'+o).className = o===t ? 'on' : '';
      $('pane-'+o).hidden = o!==t;
    }
    if (t === 'map' && st) initMap(st);
    if (t === 'map' && map) setTimeout(() => map.invalidateSize(), 60);
    poll();
  };
}
// ---- spectrum + waterfall (phase 2) ----
const spc = $('spc'), wf = $('wf');
const sctx = spc.getContext('2d'), wctx = wf.getContext('2d');
function wfBg() {
  const th = document.documentElement.dataset.theme;
  if (th === 'light') return '#111827';
  if (th === 'radio') return '#0d0f12';
  return '#000';
}
wctx.fillStyle = wfBg(); wctx.fillRect(0, 0, wf.width, wf.height);
let specState = null;
function dbColor(db) { // -120..0 dB → ramp that follows the theme
  const t = Math.max(0, Math.min(1, (db + 120) / 120));
  const th = document.documentElement.dataset.theme;
  if (th === 'light') {
    // light theme: dark-blue → cyan → yellow → red on white cards
    if (t < 0.25) return `rgb(${Math.round(t*4*30)},${Math.round(t*4*30)},${Math.round(90+t*4*160)})`;
    if (t < 0.5)  return `rgb(${Math.round(30+(t-0.25)*4*120)},${Math.round(30+(t-0.25)*4*150)},250)`;
    if (t < 0.75) return `rgb(${Math.round(150+(t-0.5)*4*105)},${Math.round(180+(t-0.5)*4*30)},${Math.round(250-(t-0.5)*4*200)})`;
    return `rgb(220,${Math.round(210-(t-0.75)*4*140)},40)`;
  }
  if (t < 0.25) return `rgb(0,0,${Math.round(t*4*140)})`;
  if (t < 0.5)  return `rgb(0,${Math.round((t-0.25)*4*200)},${Math.round(140-(t-0.25)*4*60)})`;
  if (t < 0.75) return `rgb(${Math.round((t-0.5)*4*255)},200,${Math.round(80-(t-0.5)*4*80)})`;
  return `rgb(255,${Math.round(200+(t-0.75)*4*55)},0)`;
}
async function specPoll() {
  try {
    const d = await api('/api/spec');
    if (!d.bins || !d.bins.length) return;
    specState = d;
    const n = d.bins.length;
    // waterfall: scroll down one row, paint newest at top
    wctx.drawImage(wf, 0, 1);
    for (let x = 0; x < wf.width; x++) {
      const b = d.bins[Math.floor(x / wf.width * n)];
      wctx.fillStyle = dbColor(b / 10);
      wctx.fillRect(x, 0, 1, 1);
    }
    // spectrum line
    sctx.fillStyle = wfBg(); sctx.fillRect(0, 0, spc.width, spc.height);
    sctx.beginPath();
    for (let x = 0; x < spc.width; x++) {
      const db = d.bins[Math.floor(x / spc.width * n)] / 10;
      const y = spc.height - Math.max(0, Math.min(1, (db + 120) / 120)) * (spc.height - 4) - 2;
      x === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
    }
    sctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim(); sctx.stroke();
    // listening marker on both canvases
    const lx = (d.listenHz - (d.centreHz - d.spanHz / 2)) / d.spanHz * spc.width;
    sctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--warn').trim(); sctx.beginPath(); sctx.moveTo(lx, 0); sctx.lineTo(lx, spc.height); sctx.stroke();
    wctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--warn').trim(); wctx.beginPath(); wctx.moveTo(lx, 0); wctx.lineTo(lx, 6); wctx.stroke();
    $('specinfo').textContent = (d.centreHz/1e6).toFixed(4) + ' MHz ±' + (d.spanHz/2000).toFixed(0) + ' kHz';
  } catch (e) {}
}
function canvasFreq(ev, cv) {
  if (!specState) return null;
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width;
  return specState.centreHz - specState.spanHz / 2 + x * specState.spanHz;
}
for (const cv of [spc, wf]) {
  cv.onclick = ev => {
    const hz = canvasFreq(ev, cv);
    if (hz) { cmd({cmd:'freq', hz: Math.round(hz)}); $('clickhz').textContent = 'จูน → ' + (hz/1e6).toFixed(4) + ' MHz'; }
  };
  cv.onmousemove = ev => {
    const hz = canvasFreq(ev, cv);
    if (hz) $('clickhz').textContent = (hz/1e6).toFixed(4) + ' MHz';
  };
}
// ---- web audio (phase 4): µ-law 24 kHz chunked stream ----
// AudioWorklet needs a secure context (https or localhost); on plain
// http over a LAN IP the browser has no audioWorklet at all, so a
// ScriptProcessorNode path plays the same ring buffer instead.
let actx = null, audioOn = false, audioReader = null, player = null, wgain = 1;
const ULAW_DEC = (() => {
  const t = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    let b = ~i & 0xFF;
    const sign = b & 0x80, exp = (b >> 4) & 7, mant = b & 0xF;
    let v = ((mant << 3) + 0x84) << exp;
    v -= 0x84;
    t[i] = (sign ? -v : v) / 32768;
  }
  return t;
})();
function makeRing() {
  return {
    buf: new Float32Array(24000 * 2), wr: 0, rd: 0, fill: 0,
    push(d) {
      for (let i = 0; i < d.length; i++) {
        this.buf[this.wr] = d[i];
        this.wr = (this.wr + 1) % this.buf.length;
        if (this.fill < this.buf.length) this.fill++;
        else this.rd = (this.rd + 1) % this.buf.length;
      }
    },
    pull(out, g) {
      const target = 24000 * 0.35; // start once 350 ms buffered
      if (this.fill < target) { out.fill(0); return; }
      for (let i = 0; i < out.length; i++) {
        if (this.fill > 0) {
          out[i] = this.buf[this.rd] * g;
          this.rd = (this.rd + 1) % this.buf.length;
          this.fill--;
        } else out[i] = 0;
      }
    },
  };
}
// The worklet owns its ring: Float32Array cannot be shared across the
// worklet boundary without SharedArrayBuffer, so PCM travels by message.
const workletSrc = `
class SDRPlay extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ring = { buf: new Float32Array(48000), wr: 0, rd: 0, fill: 0 };
    this.gain = 1;
    this.port.onmessage = e => {
      if (e.data.kind === 'pcm') {
        const d = e.data.buf, r = this.ring;
        for (let i = 0; i < d.length; i++) {
          r.buf[r.wr] = d[i];
          r.wr = (r.wr + 1) % r.buf.length;
          if (r.fill < r.buf.length) r.fill++;
          else r.rd = (r.rd + 1) % r.buf.length;
        }
      } else if (e.data.kind === 'gain') this.gain = e.data.v;
    };
  }
  process(inputs, outputs) {
    const out = outputs[0][0], r = this.ring;
    if (r.fill < 8400) { out.fill(0); } // 350 ms at 24 kHz
    else for (let i = 0; i < out.length; i++) {
      if (r.fill > 0) {
        out[i] = r.buf[r.rd] * this.gain;
        r.rd = (r.rd + 1) % r.buf.length;
        r.fill--;
      } else out[i] = 0;
    }
    if ((this.currentFrame & 8191) === 0)
      this.port.postMessage({ kind: 'fill', v: r.fill });
    return true;
  }
}
registerProcessor('sdr-play', SDRPlay);
`;
async function startAudio() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
  await actx.resume();
  const ring = makeRing(); // script-path ring (main thread)
  player = { kind: 'none', ring, node: null };
  if (actx.audioWorklet) {
    try {
      const blob = new Blob([workletSrc], { type: 'application/javascript' });
      await actx.audioWorklet.addModule(URL.createObjectURL(blob));
      const node = new AudioWorkletNode(actx, 'sdr-play');
      node.port.onmessage = e => {
        if (e.data.kind === 'fill') $('abuf').textContent = (e.data.v / 24000).toFixed(2) + 's';
      };
      node.connect(actx.destination);
      node.port.postMessage({ kind: 'gain', v: wgain });
      player.kind = 'worklet';
      player.node = node;
    } catch (e) { /* insecure context: fall back below */ }
  }
  if (player.kind === 'none') {
    const sp = actx.createScriptProcessor(4096, 1, 1);
    sp.onaudioprocess = e => ring.pull(e.outputBuffer.getChannelData(0), wgain);
    sp.connect(actx.destination);
    player.kind = 'script';
    player.node = sp;
    player.timer = setInterval(() => {
      $('abuf').textContent = (ring.fill / 24000).toFixed(2) + 's';
    }, 500);
  }
  const resp = await fetch('/api/audio');
  audioReader = resp.body.getReader();
  audioOn = true;
  $('listen').className = 'on';
  $('listen').textContent = '🔊 ฟัง' + (player.kind === 'script' ? ' (compat)' : '');
  (async () => {
    let head = false;
    for (;;) {
      let r;
      try { r = await audioReader.read(); } catch (e) { break; }
      if (r.done || !audioOn) break;
      let buf = r.value;
      if (!head) { head = true; buf = buf.slice(6); }
      const pcm = new Float32Array(buf.length);
      for (let i = 0; i < buf.length; i++) pcm[i] = ULAW_DEC[buf[i]];
      if (player && player.kind === 'worklet')
        player.node.port.postMessage({ kind: 'pcm', buf: pcm }, [pcm.buffer]);
      else ring.push(pcm);
    }
    if (audioOn) stopAudio(); // stream ended under us
  })();
}
function stopAudio() {
  audioOn = false;
  if (audioReader) { audioReader.cancel().catch(() => {}); audioReader = null; }
  if (player) {
    if (player.timer) clearInterval(player.timer);
    try { player.node.disconnect(); } catch (e) {}
    player = null;
  }
  $('listen').className = ''; $('listen').textContent = '🔇 ฟัง';
  $('abuf').textContent = '';
}
$('listen').onclick = () => (audioOn ? stopAudio() : startAudio().catch(e => { $('err').textContent = 'audio: ' + e.message; stopAudio(); }));
$('lmute').onclick = () => cmd({cmd:'localmute', on: !st.localmute});
$('wgain').oninput = e => {
  wgain = parseFloat(e.target.value);
  $('wgainv').textContent = Math.round(wgain * 100) + '%';
  if (player && player.kind === 'worklet') player.node.port.postMessage({ kind: 'gain', v: wgain });
};

// ---- Leaflet map (phase 3) ----
let map = null, mLayer = null, markers = {}, rxMark = null, layerIdx = 0, layers = [];
async function initMap(st) {
  if (map) return;
  layers = await api('/api/layers');
  $('mlayer').innerHTML = layers.map((l, i) => `<option value="${i}">${l.name}</option>`).join('');
  $('mlayer').onchange = e => { layerIdx = +e.target.value; setTiles(); };
  map = L.map('map', { zoomControl: true }).setView([st.rxLat, st.rxLon], 10);
  setTiles();
  rxMark = L.circleMarker([st.rxLat, st.rxLon], { radius: 6, color: '#35e08a', weight: 2, fill: false }).addTo(map).bindTooltip('RX');
  setInterval(mapPoll, 2000);
}
function setTiles() {
  if (mLayer) map.removeLayer(mLayer);
  // Tiles come from the handheld itself: its disk cache serves first,
  // the upstream tile server only when a tile was never seen.
  mLayer = L.tileLayer(`/tiles/${layerIdx}/{z}/{x}/{y}`, { maxZoom: 18, attribution: layers[layerIdx].attr }).addTo(map);
  $('mattr').textContent = layers[layerIdx].attr;
}
async function mapPoll() {
  if (!map) return;
  const rows = await api('/api/targets');
  const seen = {};
  for (const t of rows) {
    seen[t.kind + t.id] = true;
    const ll = [t.lat, t.lon];
    let m = markers[t.kind + t.id];
    const col = t.kind === 'plane' ? '#ffd166' : '#35e08a';
    if (!t.hasPos) { if (m) { map.removeLayer(m); delete markers[t.kind + t.id]; } continue; }
    if (!m) {
      m = markers[t.kind + t.id] = L.circleMarker(ll, { radius: 5, color: col, weight: 2, fillColor: col, fillOpacity: 0.5 }).addTo(map);
      m.bindTooltip(t.call, { direction: 'top' });
    } else {
      m.setLatLng(ll);
    }
    m.setStyle({ color: col });
  }
  for (const k in markers) if (!seen[k]) { map.removeLayer(markers[k]); delete markers[k]; }
}
specPoll(); setInterval(specPoll, 120);
poll(); setInterval(poll, 1500);
</script>
