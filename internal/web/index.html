<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDRg35xx Web</title>
<link rel="stylesheet" href="/static/leaflet.css">
<script src="/static/leaflet.js"></script>
<style>
:root {
  /* phosphor/radio theme (default) */
  --bg:#0b1410; --panel:#12211a; --ink:#c8f0d8; --dim:#6f9c82; --acc:#35e08a; --warn:#ffd166;
  --card-border:var(--card-border); --btn:var(--btn); --btn-border:var(--hdr-border); --btn-hover:var(--btn-hover); --input:var(--input);
  --row-hover:#16281e; --hdr-border:#2a5a40; --track:#0e1a14; --thumb:#35e08a; --err:#ff8080;
}
[data-theme=light] {
  --bg:#f6f8fa; --panel:#ffffff; --ink:#1f2937; --dim:#6b7280; --acc:#2563eb; --warn:#b45309;
  --card-border:#e5e7eb; --btn:#eef2f7; --btn-border:#cbd5e1; --btn-hover:#dbe4ee; --input:#ffffff;
  --row-hover:#f1f5f9; --hdr-border:#e5e7eb; --track:#e5e7eb; --thumb:#2563eb; --err:#dc2626;
}
[data-theme=radio] {
  /* front-panel style: dark chassis, amber digits, raised knobs */
  --bg:#0d0f12; --panel:#15181d; --ink:#e8d9b0; --dim:#8a7a55; --acc:#f4a63c; --warn:#ff7043;
  --card-border:#24292f; --btn:#1c2126; --btn-border:#3a4148; --btn-hover:#252b31; --input:#101318;
  --row-hover:#1b2025; --hdr-border:#2c323a; --track:#101318; --thumb:#f4a63c; --err:#ff5252;
  --btn-raise:0 2px 0 rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 2px rgba(0,0,0,.6);
  --btn-press:0 0 0 rgba(0,0,0,0), inset 0 2px 4px rgba(0,0,0,.75);
}
[data-theme=radio] .freq { font-family:"Courier New",monospace; font-weight:700; letter-spacing:2px;
  color:var(--acc); text-shadow:0 0 14px rgba(244,166,60,.35);
  background:var(--input); border-radius:10px; padding:6px 12px; border:1px solid #2c323a;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.04); }
[data-theme=radio] .card { border-radius:14px;
  background:linear-gradient(180deg,#171b21 0%,#12151a 100%);
  border:1px solid #24292f;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 3px 8px rgba(0,0,0,.5); }
[data-theme=radio] button {
  border-radius:999px;
  background:linear-gradient(180deg,#2a3138 0%,#1a1f24 100%);
  border:1px solid #3a4148;
  border-top-color:#4a525c;
  box-shadow:var(--btn-raise);
  color:var(--ink);
  text-shadow:0 1px 0 rgba(0,0,0,.6);
  transition:transform .06s, box-shadow .06s;
}
[data-theme=radio] button:hover { background:linear-gradient(180deg,#2a3138 0%,#171c21 100%); }
[data-theme=radio] button:active {
  transform:translateY(1px);
  box-shadow:var(--btn-press);
}
[data-theme=radio] button.on {
  background:linear-gradient(180deg,#ffc163 0%,#e89f2a 100%);
  color:#1a1204;
  border-color:#f4a63c;
  box-shadow:var(--btn-raise), 0 0 12px rgba(244,166,60,.5);
  text-shadow:none;
}
[data-theme=radio] .sys div { border-radius:999px;
  background:var(--input);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.04);
  border:1px solid #24292f; }
[data-theme=radio] .sys b { color:var(--acc); text-shadow:0 0 10px rgba(244,166,60,.3); }
[data-theme=radio] table th, [data-theme=radio] table td { border-color:var(--hdr-border); }
[data-theme=radio] canvas { border-radius:8px; box-shadow:inset 0 2px 8px rgba(0,0,0,.8); }
[data-theme=radio] input[type=range] { accent-color:var(--acc); }
[data-theme=radio] input[type=number], [data-theme=radio] select {
  background:var(--input); border-color:#333a42;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6);
}
[data-theme=radio] header { background:linear-gradient(180deg,#15181d,#0d0f12);
  border-bottom:2px solid #f4a63c; box-shadow:0 2px 10px rgba(0,0,0,.5); }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; transition:background .2s,color .2s; }
header { display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--panel); border-bottom:2px solid var(--acc); position:sticky; top:0; z-index:2; }
header h1 { font-size:16px; margin:0; letter-spacing:1px; }
#conn { font-size:12px; color:var(--dim); }
#conn.on { color:var(--acc); }
main { display:grid; grid-template-columns: 380px 1fr; gap:12px; padding:12px; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
select, input { min-width:0; }
.row .val { flex:0 0 auto; }
.card { background:var(--panel); border:1px solid var(--card-border); border-radius:10px; padding:12px; }
.card h2 { font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--dim); margin:0 0 10px; }
button.nudge { padding:2px 7px; font-size:11px; line-height:1.4; flex:0 0 auto; }
.freq { font-size:34px; font-variant-numeric:tabular-nums; color:var(--acc); cursor:pointer; }
.freq small { font-size:14px; color:var(--dim); }
.row { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:8px 0; }
.row label { flex:0 0 76px; color:var(--dim); font-size:12px; }
.row .val { flex:1; font-variant-numeric:tabular-nums; }
button { background:var(--btn); color:var(--ink); border:1px solid var(--hdr-border); border-radius:6px; padding:5px 8px; cursor:pointer; font-size:12px; }
button:hover { background:var(--btn-hover); }
button.on { background:var(--acc); color:#062012; border-color:var(--acc); font-weight:700; }
input[type=range] { flex:1; accent-color:var(--acc); }
select, input[type=number] { background:var(--input); color:var(--ink); border:1px solid var(--hdr-border); border-radius:6px; padding:5px 8px; font-size:13px; }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th { text-align:left; color:var(--dim); font-weight:600; border-bottom:1px solid var(--hdr-border); padding:4px 6px; }
td { padding:4px 6px; border-bottom:1px solid var(--row-hover); font-variant-numeric:tabular-nums; }
tr:hover td { background:var(--row-hover); }
.tabs { display:flex; gap:6px; margin-bottom:8px; }
.sys { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
.sys div { background:var(--input); border-radius:8px; padding:8px 4px; }
.sys b { display:block; font-size:18px; color:var(--acc); }
.sys span { font-size:11px; color:var(--dim); }
#err { color:var(--err); min-height:18px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>SDRg35xx</h1>
  <span id="conn">…</span>
  <span style="flex:1"></span>
  <button id="theme" data-i18n-title="ttTheme" style="font-size:12px;padding:5px 10px">☀️/🌙</button>
  <button id="lang" data-i18n-title="ttLang" style="font-size:12px;padding:5px 10px">EN</button>
  <span id="up" style="color:var(--dim);font-size:12px"></span>
</header>
<main>
  <section>
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin:0 0 10px">
        <h2 data-i18n="receiver" style="margin:0">Receiver</h2>
        <span style="flex:1"></span>
        <label data-i18n="rate" style="flex:0 0 auto;margin:0;font-size:12px;color:var(--dim)">Rate</label>
        <select id="rate" style="width:auto"></select>
      </div>
      <div class="freq" id="freq" title="click to tune">0.0000 <small>MHz</small></div>
      <div class="row">
        <button id="dn1k">−1k</button><button id="dn100">−100</button>
        <button id="up100">+100</button><button id="up1k">+1k</button>
        <button id="up10k">+10k</button>
      </div>
      <div class="row"><label data-i18n="tune">Tune</label><input type="number" id="tune" step="1000" style="flex:1"><button id="go">Go</button></div>
      <div class="row"><label data-i18n="mode">Mode</label><select id="mode"></select>
        <label style="flex:0 0 auto">BW</label><select id="bw"></select></div>
      <div class="row"><label data-i18n="gain">Gain</label><input type="range" id="gain" min="-10" max="49.6" step="0.1"><span class="val" id="gainv"></span></div>
      <div class="row"><label data-i18n="volume">Volume</label><input type="range" id="vol" min="0" max="1.5" step="0.05"><span class="val" id="volv"></span></div>
      <div class="row"><label data-i18n="squelch">Squelch</label><input type="range" id="sql" min="-100" max="0" step="1"><span class="val" id="sqlv"></span></div>
      <div class="row"><label data-i18n="ppm">PPM</label><input type="range" id="ppm" min="-120" max="120" step="1"><span class="val" id="ppmv"></span>
        <button id="ppmoff" title="leave correction to the server">OFF</button></div>
      <div class="row">
        <button id="agc">AGC</button>
        <button id="ft8">FT8</button>
        <button id="aisrf">AIS RF</button>
        <button id="wefax">FAX</button>
        <button id="listen" data-i18n-title="ttListen">🔇 ฟัง</button>
        <button id="lmute" data-i18n-title="ttMute">🔈 เครื่อง</button>
      </div>
      <div class="row"><label data-i18n="webvol">เสียงเว็บ</label><input type="range" id="wgain" min="0" max="3" step="0.1" value="1"><span class="val" id="wgainv">100%</span>
        <span class="val" id="abuf" style="color:var(--dim)"></span></div>
      <div id="err"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2 data-i18n="system">System</h2>
      <div class="sys">
        <div><b id="cpu">–</b><span data-i18n="cpupct">CPU %</span></div>
        <div><b id="mem">–</b><span data-i18n="mempct">MEM %</span></div>
        <div><b id="bat">–</b><span data-i18n="batpct">BAT %</span></div>
        <div><b id="tcpu">–</b><span data-i18n="cputemp">CPU °C</span></div>
        <div><b id="tgpu">–</b><span data-i18n="gputemp">GPU °C</span></div>
        <div><b id="tddr">–</b><span data-i18n="ddrtemp">DDR °C</span></div>
        <div><b id="tgt">–</b><span>✈ / ⛵</span></div>
        <div><b id="upb">–</b><span data-i18n="uptime">UP</span></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="upd">⬆ <span data-i18n="update">อัปเดตระบบ</span></button>
        <span class="val" id="updst" style="color:var(--dim);font-size:12px"></span>
      </div>
    </div>
  </section>
  <section>
    <div class="card">
      <h2><span data-i18n="spectrum">Spectrum</span> <span id="specinfo" style="color:var(--dim);text-transform:none;letter-spacing:0"></span></h2>
      <div style="position:relative">
        <canvas id="spc" width="512" height="110" style="width:100%;height:110px;cursor:crosshair;background:var(--bg);touch-action:none"></canvas>
        <canvas id="spcOv" width="512" height="110" style="position:absolute;inset:0;width:100%;height:110px;pointer-events:none"></canvas>
      </div>
      <div style="position:relative;margin-top:4px" id="wfwrap">
        <canvas id="wf" width="512" height="240" style="width:100%;height:240px;cursor:crosshair;touch-action:none"></canvas>
        <canvas id="wfOv" width="512" height="240" style="position:absolute;inset:0;width:100%;height:240px;pointer-events:none"></canvas>
      </div>
      <div class="row" style="margin-top:6px"><label data-i18n="clicktune">คลิกกราฟ/น้ำตก = จูน</label><span class="val" id="clickhz" style="color:var(--dim)"></span></div>
      <div class="row"><label data-i18n="wfmin">น้ำตก ต่ำสุด</label><input type="range" id="wfmin" min="0" max="40" step="1"><span class="val" id="wfminv"></span></div>
      <div class="row"><label data-i18n="wfmax">น้ำตก สูงสุด</label><input type="range" id="wfmax" min="10" max="120" step="2"><span class="val" id="wfmaxv"></span></div>
      <div id="wfxbox" hidden>
        <div class="row" style="margin:6px 0 2px">
          <label data-i18n="wefax">WEFAX</label>
          <span class="val" id="wfxst" style="color:var(--dim)"></span>
          <button id="wfxsave" data-i18n="wefaxSave">บันทึก</button>
          <button id="wfxauto" data-i18n="wefaxAuto">เซฟอัตโนมัติ</button>
          <button id="wfxclear" data-i18n="wefaxClear">ล้าง</button>
        </div>
        <img id="wfximg" alt="WEFAX" style="display:block;width:100%;max-height:280px;object-fit:contain;image-rendering:pixelated;background:#000;border-radius:6px;border:1px solid var(--card-border)">
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="tabs">
        <button id="tab-ft8" class="on">FT8</button>
        <button id="tab-ais">AIS</button>
        <button id="tab-tgt" data-i18n="targets">Targets</button>
        <button id="tab-map" data-i18n="map">Map</button>
      </div>
      <div id="pane-map" hidden><div id="map" style="height:420px;border-radius:8px;background:#0b1410"></div>
        <div class="row" style="margin-top:6px"><label data-i18n="mlayer">ชั้นแผนที่</label><select id="mlayer"></select>
          <span class="val" id="mattr" style="color:var(--dim);font-size:11px"></span></div>
      </div>
      <div id="pane-ft8"><table><thead><tr><th data-i18n="time">เวลา</th><th>SNR</th><th>Hz</th><th data-i18n="msg">ข้อความ</th><th data-i18n="ctry">ประเทศ/ระยะ</th></tr></thead><tbody id="ft8b"></tbody></table></div>
      <div id="pane-ais" hidden><table><thead><tr><th data-i18n="time">เวลา</th><th>ch</th><th>dB</th><th data-i18n="msg">ข้อความ</th></tr></thead><tbody id="aisb"></tbody></table></div>
      <div id="pane-tgt" hidden><table><thead><tr><th data-i18n="kind">ชนิด</th><th data-i18n="name">ชื่อ/ทะเบียน</th><th data-i18n="pos">พิกัด</th><th data-i18n="altspd">สูง/เร็ว</th><th data-i18n="dir">ทิศ</th><th data-i18n="age">อายุ</th></tr></thead><tbody id="tgtb"></tbody></table></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
// ---- i18n: TH (default) / EN, remembered per browser ----
const STRINGS = {
  th: {
    receiver: 'ตัวรับสัญญาณ', system: 'ระบบ', spectrum: 'สเปกตรัม',
    cpupct: 'CPU %', mempct: 'MEM %', batpct: 'BAT %',
    cputemp: 'CPU °C', gputemp: 'GPU °C', ddrtemp: 'DDR °C', uptime: 'อัปไทม์',
    update: 'อัปเดตระบบ', targets: 'เป้าหมาย', map: 'แผนที่',
    time: 'เวลา', msg: 'ข้อความ', ctry: 'ประเทศ/ระยะ',
    kind: 'ชนิด', name: 'ชื่อ/ทะเบียน', pos: 'พิกัด', altspd: 'สูง/เร็ว', dir: 'ทิศ', age: 'อายุ',
    clicktune: 'คลิกกราฟ/น้ำตก = จูน', mlayer: 'ชั้นแผนที่', webvol: 'เสียงเว็บ',
    rate: 'Rate', wfmin: 'น้ำตก ต่ำสุด', wfmax: 'น้ำตก สูงสุด',
    wefax: 'WEFAX', wefaxSave: 'บันทึก', wefaxAuto: 'เซฟอัตโนมัติ', wefaxClear: 'ล้าง',
    wfxWait: 'รอสัญญาณ', wfxPhasing: 'phasing', wfxRx: 'รับ', wfxLines: ' บรรทัด',
    wefax_saved: 'บันทึก WEFAX: ', wefax_empty: 'WEFAX ยังไม่มีภาพ',
    ft8_modelock: 'FT8 ล็อกโหมด USB — ปิด FT8 ก่อนจึงเปลี่ยนโหมดได้',
    aisrf_modelock: 'AIS RF ล็อกโหมด NFM — ปิด AIS RF ก่อนจึงเปลี่ยนโหมดได้',
    tune: 'จูน', mode: 'โหมด', gain: 'กำลังสัญญาณ', volume: 'ระดับเสียง', squelch: 'สเกลช', ppm: 'PPM',
    listenOn: '🔊 ฟัง', listenOff: '🔇 ฟัง', compat: ' (compat)',
    devOn: '🔈 เครื่อง', devOff: '🔇 เครื่อง',
    connFail: '○ เว็บไม่ตอบ', connOff: '○ ไม่เชื่อมต่อ ', tuned: 'จูน → ', reset: ' · ดับเบิลคลิกรีเซ็ต',
    ttTheme: 'สลับธีม', ttListen: 'สตรีมเสียงจากเครื่องเกม', ttMute: 'ปิดลำโพงเครื่องเกม (เว็บยังได้ยิน)', ttLang: 'Switch to English',
    nextTheme: { phosphor: '☀️ ขาว', light: '📻 วิทยุ', radio: '💡 เขียว' },
  },
  en: {
    receiver: 'Receiver', system: 'System', spectrum: 'Spectrum',
    cpupct: 'CPU %', mempct: 'MEM %', batpct: 'BAT %',
    cputemp: 'CPU °C', gputemp: 'GPU °C', ddrtemp: 'DDR °C', uptime: 'UP',
    update: 'Update system', targets: 'Targets', map: 'Map',
    time: 'Time', msg: 'Message', ctry: 'Country/dist',
    kind: 'Kind', name: 'Name/reg', pos: 'Position', altspd: 'Alt/Spd', dir: 'Dir', age: 'Age',
    clicktune: 'Click graph/waterfall = tune', mlayer: 'Map layer', webvol: 'Web volume',
    rate: 'Rate', wfmin: 'WF min', wfmax: 'WF max',
    wefax: 'WEFAX', wefaxSave: 'Save', wefaxAuto: 'Auto save', wefaxClear: 'Clear',
    wfxWait: 'waiting', wfxPhasing: 'phasing', wfxRx: 'receiving', wfxLines: ' lines',
    wefax_saved: 'WEFAX saved: ', wefax_empty: 'WEFAX: no image yet',
    ft8_modelock: 'FT8 locks USB — turn FT8 off to change mode',
    aisrf_modelock: 'AIS RF locks NFM — turn AIS RF off to change mode',
    tune: 'Tune', mode: 'Mode', gain: 'Gain', volume: 'Volume', squelch: 'Squelch', ppm: 'PPM',
    listenOn: '🔊 Listen', listenOff: '🔇 Listen', compat: ' (compat)',
    devOn: '🔈 Device', devOff: '🔇 Device',
    connFail: '○ no response', connOff: '○ offline ', tuned: 'Tuned → ', reset: ' · dbl-click reset',
    ttTheme: 'Switch theme', ttListen: 'Stream audio from device', ttMute: 'Mute device speaker (web still hears)', ttLang: 'เปลี่ยนเป็นภาษาไทย',
    nextTheme: { phosphor: '☀️ Light', light: '📻 Radio', radio: '💡 Green' },
  },
};
let lang = 'th', langPinned = false;
function applyLang(l, pin) {
  lang = l;
  if (pin !== false) { try { localStorage.setItem('sdr-lang', l); } catch (e) {} }
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (STRINGS[l][k]) el.textContent = STRINGS[l][k];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const k = el.dataset.i18nTitle;
    if (STRINGS[l][k]) el.title = STRINGS[l][k];
  });
  $('lang').textContent = l === 'th' ? 'EN' : 'ไทย';
  $('lang').title = STRINGS[l].ttLang;
  try { if (st) renderState(st); } catch (e) {}
  try { if (specState) drawOverlays(); } catch (e) {}
}
{
  let l = 'th';
  try { l = localStorage.getItem('sdr-lang') || ''; } catch (e) {}
  if (l === 'en' || l === 'th') { langPinned = true; applyLang(l); }
}
$('lang').onclick = () => { langPinned = true; applyLang(lang === 'th' ? 'en' : 'th'); };
// Theme: 'phosphor' (default) or 'light', remembered per browser.
const THEMES = { phosphor: null, light: 'light', radio: 'radio' };
function themeLabel(name) {
  // Show the NEXT theme the button will switch to.
  return STRINGS[lang].nextTheme[name] || '';
}
function applyTheme(name) {
  document.documentElement.dataset.theme = THEMES[name] || '';
  try { localStorage.setItem('sdr-theme', name); } catch (e) {}
  $('theme').textContent = themeLabel(name);
}
{
  let t = 'phosphor';
  try { t = localStorage.getItem('sdr-theme') || 'phosphor'; } catch (e) {}
  applyTheme(t);
}
$('theme').onclick = () => {
  // The phosphor theme stores dataset.theme as '' — read the label as
  // the current theme instead of guessing from the empty string.
  const cur = document.documentElement.dataset.theme === '' ? 'phosphor'
    : document.documentElement.dataset.theme === 'light' ? 'light' : 'radio';
  const next = cur === 'phosphor' ? 'light' : cur === 'light' ? 'radio' : 'phosphor';
  applyTheme(next);
  if (typeof wf !== 'undefined' && wctx) { wctx.fillStyle = wfBg(); wctx.fillRect(0, 0, wf.width, wf.height); }
  if (typeof drawOverlays === 'function') drawOverlays();
};
let st = null, tab = 'ft8', rebootPending = false;
const fmtMHz = hz => (hz/1e6).toFixed(4);

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(path + ' → ' + r.status);
  const d = await r.json();
  if (d && d.ok === false && d.err) throw new Error(d.err);
  return d;
}
let errTok = 0;
function showErr(msg) {

      const r = cv.getBoundingClientRect();
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const x = ((a.clientX + b.clientX) / 2 - r.left) / r.width * wf.width;
      const anchor = viewHzofX(x);
      if (tD > 0) wfZoom = Math.max(1, Math.min(ZOOM_MAX, wfZoom * d / tD));
      const newSpan = specState.spanHz / wfZoom;
      wfPanHz = anchor - (x / wf.width - 0.5) * newSpan - specState.centreHz;
      tD = d;
      clampPan();
      drawView();
    } else if (e.touches.length === 1 && dragOn) {
      e.preventDefault();
      const dxPx = (e.touches[0].clientX - dragX0) / cv.getBoundingClientRect().width;
      wfPanHz = dragPan0 - dxPx * viewBw();
      clampPan();
      if (Math.abs(e.touches[0].clientX - dragX0) > 6) dragMoved = true;
      drawView();
    }
  }, { passive: false });
  const touchDone = (e) => {
    tD = 0;
    if (e.touches.length === 1) { // pinch → drag handoff
      dragOn = true; dragMoved = true; dragX0 = e.touches[0].clientX; dragPan0 = wfPanHz;
    } else if (e.touches.length === 0) {
      dragOn = false;
      // double-tap = reset zoom (dblclick is unreliable on touch)
      const t = Date.now(), x0 = e.changedTouches[0] ? e.changedTouches[0].clientX : 0;
      if (t - lastTapT < 300 && Math.abs(x0 - lastTapX) < 40 && !dragMoved) {
        wfZoom = 1; wfPanHz = 0; drawView();
      }
      lastTapT = t; lastTapX = x0;
    }
  };
  cv.addEventListener('touchend', touchDone);
  cv.addEventListener('touchcancel', touchDone);
  cv.onclick = (ev) => {
    if (dragMoved) return;
    const hz = canvasFreq(ev, cv);
    if (!hz) return;
    let dial = hz;
    // CW: the beat window is above the dial (e.g. +650..+750) — dial
    // below the click so the clicked carrier lands mid-window.
    if ((specState.mode || '').toUpperCase() === 'CW' && specState.pbLo !== undefined) {
      dial = hz - (specState.pbLo + specState.pbHi) / 2;
    }
    cmd({cmd:'freq', hz: Math.round(dial)});
    $('clickhz').textContent = STRINGS[lang].tuned + (dial/1e6).toFixed(4) + ' MHz';
  };
}

// ---- web audio (phase 4): µ-law 24 kHz chunked stream ----
// AudioWorklet needs a secure context (https or localhost); on plain
// http over a LAN IP the browser has no audioWorklet at all, so a
// ScriptProcessorNode path plays the same ring buffer instead.
let actx = null, audioOn = false, audioReader = null, player = null, wgain = 1;
const ULAW_DEC = (() => {
  const t = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    let b = ~i & 0xFF;
    const sign = b & 0x80, exp = (b >> 4) & 7, mant = b & 0xF;
    let v = ((mant << 3) + 0x84) << exp;
    v -= 0x84;
    t[i] = (sign ? -v : v) / 32768;
  }
  return t;
})();
function makeRing() {
  return {
    buf: new Float32Array(24000 * 2), wr: 0, rd: 0, fill: 0,
    push(d) {
      for (let i = 0; i < d.length; i++) {
        this.buf[this.wr] = d[i];
        this.wr = (this.wr + 1) % this.buf.length;
        if (this.fill < this.buf.length) this.fill++;
        else this.rd = (this.rd + 1) % this.buf.length;
      }
    },
    pull(out, g) {
      const target = 24000 * 0.35; // start once 350 ms buffered
      if (this.fill < target) { out.fill(0); return; }
      for (let i = 0; i < out.length; i++) {
        if (this.fill > 0) {
          out[i] = this.buf[this.rd] * g;
          this.rd = (this.rd + 1) % this.buf.length;
          this.fill--;
        } else out[i] = 0;
      }
    },
  };
}
// The worklet owns its ring: Float32Array cannot be shared across the
// worklet boundary without SharedArrayBuffer, so PCM travels by message.
const workletSrc = `
class SDRPlay extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ring = { buf: new Float32Array(48000), wr: 0, rd: 0, fill: 0 };
    this.gain = 1;
    this.port.onmessage = e => {
      if (e.data.kind === 'pcm') {
        const d = e.data.buf, r = this.ring;
        for (let i = 0; i < d.length; i++) {
          r.buf[r.wr] = d[i];
          r.wr = (r.wr + 1) % r.buf.length;
          if (r.fill < r.buf.length) r.fill++;
          else r.rd = (r.rd + 1) % r.buf.length;
        }
      } else if (e.data.kind === 'gain') this.gain = e.data.v;
    };
  }
  process(inputs, outputs) {
    const out = outputs[0][0], r = this.ring;
    if (r.fill < 8400) { out.fill(0); } // 350 ms at 24 kHz
    else for (let i = 0; i < out.length; i++) {
      if (r.fill > 0) {
        out[i] = r.buf[r.rd] * this.gain;
        r.rd = (r.rd + 1) % r.buf.length;
        r.fill--;
      } else out[i] = 0;
    }
    if ((this.currentFrame & 8191) === 0)
      this.port.postMessage({ kind: 'fill', v: r.fill });
    return true;
  }
}
registerProcessor('sdr-play', SDRPlay);
`;
async function startAudio() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
  await actx.resume();
  const ring = makeRing(); // script-path ring (main thread)
  player = { kind: 'none', ring, node: null };
  if (actx.audioWorklet) {
    try {
      const blob = new Blob([workletSrc], { type: 'application/javascript' });
      await actx.audioWorklet.addModule(URL.createObjectURL(blob));
      const node = new AudioWorkletNode(actx, 'sdr-play');
      node.port.onmessage = e => {
        if (e.data.kind === 'fill') $('abuf').textContent = (e.data.v / 24000).toFixed(2) + 's';
      };
      node.connect(actx.destination);
      node.port.postMessage({ kind: 'gain', v: wgain });
      player.kind = 'worklet';
      player.node = node;
    } catch (e) { /* insecure context: fall back below */ }
  }
  if (player.kind === 'none') {
    const sp = actx.createScriptProcessor(4096, 1, 1);
    sp.onaudioprocess = e => ring.pull(e.outputBuffer.getChannelData(0), wgain);
    sp.connect(actx.destination);
    player.kind = 'script';
    player.node = sp;
    player.timer = setInterval(() => {
      $('abuf').textContent = (ring.fill / 24000).toFixed(2) + 's';
    }, 500);
  }
  const resp = await fetch('/api/audio');
  audioReader = resp.body.getReader();
  audioOn = true;
  $('listen').className = 'on';
  $('listen').textContent = STRINGS[lang].listenOn + (player.kind === 'script' ? STRINGS[lang].compat : '');
  (async () => {
    let head = false;
    for (;;) {
      let r;
      try { r = await audioReader.read(); } catch (e) { break; }
      if (r.done || !audioOn) break;
      let buf = r.value;
      if (!head) { head = true; buf = buf.slice(6); }
      const pcm = new Float32Array(buf.length);
      for (let i = 0; i < buf.length; i++) pcm[i] = ULAW_DEC[buf[i]];
      if (player && player.kind === 'worklet')
        player.node.port.postMessage({ kind: 'pcm', buf: pcm }, [pcm.buffer]);
      else ring.push(pcm);
    }
    if (audioOn) stopAudio(); // stream ended under us
  })();
}
function stopAudio() {
  audioOn = false;
  if (audioReader) { audioReader.cancel().catch(() => {}); audioReader = null; }
  if (player) {
    if (player.timer) clearInterval(player.timer);
    try { player.node.disconnect(); } catch (e) {}
    player = null;
  }
  $('listen').className = ''; $('listen').textContent = STRINGS[lang].listenOff;
  $('abuf').textContent = '';
}
$('listen').onclick = () => (audioOn ? stopAudio() : startAudio().catch(e => { showErr('audio: ' + e.message); stopAudio(); }));
$('lmute').onclick = () => cmd({cmd:'localmute', on: !st.localmute});
$('upd').onclick = () => cmd({cmd:'update'});
$('wgain').oninput = e => {
  wgain = parseFloat(e.target.value);
  $('wgainv').textContent = Math.round(wgain * 100) + '%';
  if (player && player.kind === 'worklet') player.node.port.postMessage({ kind: 'gain', v: wgain });
};

// ---- Leaflet map (phase 3) ----
let map = null, mLayer = null, markers = {}, rxMark = null, layerIdx = 0, layers = [];
async function initMap(st) {
  if (map) return;
  layers = await api('/api/layers');
  $('mlayer').innerHTML = layers.map((l, i) => `<option value="${i}">${l.name}</option>`).join('');
  $('mlayer').onchange = e => { layerIdx = +e.target.value; setTiles(); };
  map = L.map('map', { zoomControl: true }).setView([st.rxLat, st.rxLon], 10);
  setTiles();
  rxMark = L.circleMarker([st.rxLat, st.rxLon], { radius: 6, color: '#35e08a', weight: 2, fill: false }).addTo(map).bindTooltip('RX');
  setInterval(mapPoll, 2000);
}
function setTiles() {
  if (mLayer) map.removeLayer(mLayer);
  // Tiles come from the handheld itself: its disk cache serves first,
  // the upstream tile server only when a tile was never seen.
  mLayer = L.tileLayer(`/tiles/${layerIdx}/{z}/{x}/{y}`, { maxZoom: 18, attribution: layers[layerIdx].attr }).addTo(map);
  $('mattr').textContent = layers[layerIdx].attr;
}
async function mapPoll() {
  if (!map) return;
  const rows = await api('/api/targets');
  const seen = {};
  for (const t of rows) {
    seen[t.kind + t.id] = true;
    const ll = [t.lat, t.lon];
    let m = markers[t.kind + t.id];
    const col = t.kind === 'plane' ? '#ffd166' : '#35e08a';
    if (!t.hasPos) { if (m) { map.removeLayer(m); delete markers[t.kind + t.id]; } continue; }
    if (!m) {
      m = markers[t.kind + t.id] = L.circleMarker(ll, { radius: 5, color: col, weight: 2, fillColor: col, fillOpacity: 0.5 }).addTo(map);
      m.bindTooltip(t.call, { direction: 'top' });
    } else {
      m.setLatLng(ll);
    }
    m.setStyle({ color: col });
  }
  for (const k in markers) if (!seen[k]) { map.removeLayer(markers[k]); delete markers[k]; }
}
(async function specLoop() {
  for (;;) {
    const t0 = performance.now();
    await specPoll();
    await new Promise(r => setTimeout(r, Math.max(30, 120 - (performance.now() - t0))));
  }
})();
// Fine-adjust arrows for every slider: ◀/▶ nudge by one step (the
// same handlers run via the input event, so cmds go out as usual).
document.querySelectorAll('input[type=range]').forEach(sl => {
  const step = parseFloat(sl.step) || 1;
  const dec = (String(sl.step).split('.')[1] || '').length;
  const nudge = d => {
    let v = (parseFloat(sl.value) || 0) + d * step;
    v = Math.max(+sl.min, Math.min(+sl.max, v));
    sl.value = (Math.round(v / step) * step).toFixed(dec);
    sl.dispatchEvent(new Event('input', { bubbles: true }));
  };
  const mk = (txt, d) => {
    const b = document.createElement('button');
    b.className = 'nudge'; b.textContent = txt; b.tabIndex = -1;
    b.onclick = () => nudge(d);
    return b;
  };
  sl.insertAdjacentElement('beforebegin', mk('◀', -1));
  sl.insertAdjacentElement('afterend', mk('▶', 1));
});
poll(); setInterval(poll, 1500);
</script>
</body>
